TOPICS.push(
 {id:'aman', title:'Keamanan Data & Penipuan Digital', cat:'wajib', img:'t_aman',
  desc:'Mengenali modus penipuan digital yang paling sering terjadi, melindungi data pribadi dan akun keuangan, serta langkah cepat bila menjadi korban.',
  src:'OJK dan Satgas PASTI, Indonesia Anti-Scam Centre (IASC) · OJK, Waspada Social Engineering · Bank Indonesia, Edukasi Perlindungan Konsumen · FTC (Amerika Serikat), How to Recognize and Avoid Phishing Scams · UU No. 27/2022 tentang Pelindungan Data Pribadi',
  sets:[
   {name:'Modus yang Sering Terjadi', cards:[
    {q:'Apa itu <b>social engineering</b>?', a:'Teknik manipulasi psikologis agar korban sendiri yang menyerahkan data rahasia atau mentransfer uang. Pelaku memanfaatkan rasa takut (rekening akan diblokir), rasa senang (menang hadiah), rasa terdesak (promo berakhir hari ini), atau rasa percaya (mengaku petugas resmi).',
     pts:['Phishing: tautan atau situs palsu yang meniru bank, kurir, atau instansi.','Vishing: telepon dari "petugas bank" yang meminta OTP.','Smishing: SMS atau WhatsApp berisi tautan berbahaya.','Pretexting: cerita palsu yang meyakinkan, misalnya keluarga kecelakaan.']},
    {q:'Bagaimana modus <b>file APK</b> dan undangan palsu bekerja?', a:'Pelaku mengirim file berakhiran .apk yang disamarkan sebagai undangan pernikahan, surat tilang, tagihan, atau resi paket. Jika dipasang, aplikasi itu dapat membaca SMS termasuk kode OTP, lalu pelaku menguras rekening lewat mobile banking.',
     warn:'Jangan pernah memasang file .apk dari chat. Undangan asli berbentuk gambar, PDF, atau tautan situs, bukan aplikasi.',
     tip:'Matikan izin "Instal aplikasi tidak dikenal" di pengaturan Android.'},
    {q:'Modus apa lagi yang <b>marak</b>?', a:'Penipu terus memperbarui cerita. Polanya sama: membuat korban panik atau tergiur, lalu meminta data atau transfer.',
     pts:['Perubahan tarif transfer bank: korban diminta mengisi formulir di tautan palsu.','Kerja paruh waktu "like dan subscribe": awalnya dibayar kecil, lalu diminta deposit untuk "misi" lebih besar.','Akun palsu customer service di media sosial.','Salah transfer palsu: pelaku mengaku salah kirim dan meminta uang dikembalikan ke rekening lain.','Penawaran pinjaman tanpa syarat atau investasi bodong lewat SMS.']}
   ]},
   {name:'Melindungi Data & Akun', cards:[
    {q:'Data apa yang termasuk <b>rahasia mutlak</b>?', a:'PIN, password, kode OTP, CVV kartu, dan jawaban pertanyaan keamanan tidak boleh diberikan kepada siapa pun, termasuk keluarga atau yang mengaku pegawai bank, OJK, atau BI. Lembaga resmi tidak pernah meminta data tersebut.',
     pts:['Data pribadi seperti NIK, nama ibu kandung, dan tanggal lahir juga perlu dijaga karena dipakai untuk verifikasi.','Hati-hati mengunggah foto KTP, kartu, atau boarding pass di media sosial.','Saat menyerahkan fotokopi KTP, beri tanda air atau tulisan keperluan di atasnya.']},
    {q:'Bagaimana membuat akun lebih <b>sulit dibobol</b>?', a:'Lapisan pengamanan berlapis membuat pelaku kesulitan walau satu lapis bocor.',
     pts:['Password unik dan panjang untuk setiap layanan, bantu dengan pengelola password.','Aktifkan autentikasi dua faktor (2FA) di email dan media sosial.','Kunci ponsel dengan PIN atau biometrik, dan aktifkan fitur lacak serta hapus jarak jauh.','Atur limit transaksi harian dan notifikasi setiap transaksi.'],
     tip:'Email adalah kunci utama karena dipakai untuk reset password layanan lain. Lindungi email lebih dulu.'},
    {q:'Bagaimana <b>mengenali tautan palsu</b>?', a:'Periksa alamat situs dengan teliti sebelum memasukkan data. Situs palsu sering memakai ejaan mirip, domain gratisan, atau tambahan kata.',
     ex:'Situs resmi bank memakai domain resmi bank tersebut. Alamat seperti "bank-xyz-tarif.blogspot.com" atau "bankxyz.id-promo.com" hampir pasti palsu.',
     pts:['Tanda bahaya: salah ketik, tekanan waktu, hadiah terlalu besar, permintaan data rahasia.','Akses layanan bank dengan mengetik alamat sendiri atau dari aplikasi resmi, jangan dari tautan pesan.']}
   ]},
   {name:'Jika Menjadi Korban', cards:[
    {q:'Apa <b>langkah pertama</b> saat merasa tertipu?', a:'Kecepatan sangat menentukan peluang dana terselamatkan.',
     pts:['Segera hubungi call center resmi bank untuk memblokir rekening, kartu, dan mobile banking.','Ganti password email dan akun lain yang terhubung.','Laporkan ke Indonesia Anti-Scam Centre (IASC) milik OJK dan Satgas PASTI agar dana di rekening penerima bisa ditelusuri dan diblokir.','Simpan bukti: tangkapan layar percakapan, nomor rekening pelaku, dan bukti transfer.','Buat laporan ke kepolisian bila diperlukan untuk proses lanjutan.']},
    {q:'Bagaimana <b>membantu orang lain</b> agar tidak tertipu?', a:'Kelompok yang paling sering menjadi sasaran adalah orang tua dan pengguna baru layanan digital. Berbagi informasi modus terbaru di grup keluarga adalah langkah pencegahan sederhana yang efektif.',
     tip:'Sepakati "kata sandi keluarga" untuk memastikan telepon darurat yang mengaku anggota keluarga memang asli.'}
   ]}
  ]},

 {id:'investasi', title:'Dasar Investasi', cat:'wajib', img:'t_investasi',
  desc:'Memahami hubungan risiko dan imbal hasil, bunga majemuk, inflasi, profil risiko, alokasi aset, diversifikasi, serta strategi investasi rutin.',
  src:'OJK, Buku Seri Literasi Keuangan Pasar Modal · IDX, Sekolah Pasar Modal · U.S. SEC Investor.gov, Introduction to Investing · CFA Institute, Investment Foundations · Bodie, Kane & Marcus, Investments',
  sets:[
   {name:'Risiko & Imbal Hasil', cards:[
    {q:'Bagaimana hubungan <b>risiko</b> dan <b>imbal hasil</b>?', a:'Semakin tinggi potensi imbal hasil sebuah instrumen, semakin tinggi pula risikonya, yaitu kemungkinan nilainya turun atau hasilnya berbeda dari harapan. Tawaran untung besar dengan risiko rendah patut dicurigai.',
     pts:['Deposito dan SBN: risiko rendah, imbal hasil relatif rendah dan stabil.','Obligasi korporasi dan reksa dana pendapatan tetap: risiko menengah.','Saham dan reksa dana saham: risiko tinggi dalam jangka pendek, potensi imbal hasil tertinggi dalam jangka panjang.']},
    {q:'Apa saja <b>jenis risiko</b> investasi?', a:'Risiko tidak hanya berarti harga turun. Mengenali jenisnya membantu memilih cara mengelolanya.',
     pts:['Risiko pasar: harga turun karena kondisi ekonomi atau sentimen.','Risiko inflasi: imbal hasil kalah oleh kenaikan harga.','Risiko likuiditas: sulit menjual tanpa memotong harga.','Risiko gagal bayar: penerbit obligasi tidak mampu membayar.','Risiko suku bunga: harga obligasi turun saat suku bunga naik.','Risiko konsentrasi: terlalu banyak dana di satu aset.']},
    {q:'Apa itu <b>profil risiko</b>?', a:'Gambaran seberapa besar penurunan nilai investasi yang sanggup kamu tanggung, secara finansial maupun mental. Profil ini dipengaruhi usia, tujuan, jangka waktu, kondisi keuangan, dan pengalaman. Manajer investasi dan agen penjual reksa dana wajib meminta nasabah mengisi kuesioner profil risiko.',
     pts:['Konservatif: utamakan keamanan pokok.','Moderat: siap fluktuasi sedang demi hasil lebih tinggi.','Agresif: siap fluktuasi besar demi potensi hasil tinggi jangka panjang.'],
     tip:'Uji diri: jika investasimu turun 20% dalam sebulan, apakah kamu akan panik menjual? Jika ya, kurangi porsi aset berisiko.'}
   ]},
   {name:'Bunga Majemuk & Inflasi', cards:[
    {q:'Apa itu <b>bunga majemuk</b>?', a:'Imbal hasil yang diperoleh ikut diinvestasikan kembali sehingga menghasilkan imbal hasil berikutnya. Makin panjang waktunya, makin besar efek bola saljunya. Waktu adalah faktor paling berpengaruh.',
     f:'Nilai akhir = Modal × (1 + r)ⁿ',
     ex:'Rp1 juta per bulan selama 30 tahun dengan imbal hasil 8% per tahun menjadi sekitar Rp1,5 miliar, padahal total setoran hanya Rp360 juta. Jika baru mulai 10 tahun kemudian (20 tahun), hasilnya sekitar Rp590 juta.'},
    {q:'Apa itu <b>Rule of 72</b>?', a:'Cara cepat memperkirakan lama waktu uang menjadi dua kali lipat: bagi 72 dengan imbal hasil tahunan. Cara yang sama bisa dipakai untuk melihat seberapa cepat inflasi memotong daya beli menjadi setengahnya.',
     f:'Waktu ganda ≈ 72 ÷ imbal hasil tahunan (%)',
     ex:'Imbal hasil 8%: sekitar 9 tahun. Inflasi 3%: daya beli uang tunai turun separuh dalam sekitar 24 tahun.'},
    {q:'Apa itu <b>imbal hasil riil</b>?', a:'Imbal hasil setelah dikurangi inflasi. Inilah kenaikan daya beli yang sebenarnya. Investasi perlu memberi imbal hasil riil positif agar tujuan jangka panjang tercapai.',
     f:'Imbal hasil riil ≈ Imbal hasil nominal − Inflasi',
     ex:'Deposito 4% dikurangi pajak 20% menjadi 3,2%. Dengan inflasi 2,5%, imbal hasil riil sekitar 0,7%.'}
   ]},
   {name:'Alokasi & Strategi', cards:[
    {q:'Apa itu <b>alokasi aset</b> dan <b>diversifikasi</b>?', a:'Alokasi aset adalah pembagian dana ke kelas aset berbeda (kas, obligasi, saham, emas). Diversifikasi menyebar dana di dalam dan antar kelas aset agar kerugian di satu tempat dapat diimbangi tempat lain. Riset akademik menunjukkan alokasi aset adalah penentu terbesar variasi hasil portofolio jangka panjang.',
     ex:'Profil moderat untuk tujuan 7 tahun: 50% reksa dana saham, 40% obligasi atau SBN, 10% pasar uang.',
     warn:'Membeli lima saham dari sektor yang sama belum termasuk diversifikasi yang baik.'},
    {q:'Apa itu <b>dollar cost averaging</b> (investasi rutin)?', a:'Menginvestasikan nominal yang sama secara berkala tanpa melihat kondisi pasar. Saat harga turun, kamu mendapat unit lebih banyak. Strategi ini mengurangi risiko salah waktu masuk dan membangun kebiasaan.',
     ex:'Investasi Rp500 ribu per bulan di reksa dana. Bulan 1 NAB Rp1.000 (500 unit), bulan 2 NAB Rp800 (625 unit), bulan 3 NAB Rp1.000 (500 unit). Rata-rata harga beli sekitar Rp923, lebih rendah dari rata-rata NAB Rp933.'},
    {q:'Apa itu <b>rebalancing</b>?', a:'Mengembalikan komposisi portofolio ke alokasi target secara berkala, misalnya setahun sekali. Jika saham naik tajam sehingga porsinya membengkak, sebagian dijual dan dipindahkan ke aset lain. Rebalancing menjaga risiko tetap sesuai profil dan secara disiplin "menjual mahal, membeli murah".',
     tip:'Seiring tujuan makin dekat, geser porsi ke instrumen yang lebih stabil (strategi glide path).'}
   ]}
  ]},

 {id:'asuransi', title:'Asuransi & Proteksi', cat:'wajib', img:'shield',
  desc:'Mengalihkan risiko finansial besar ke perusahaan asuransi: jenis asuransi, cara menghitung kebutuhan proteksi, membaca polis, dan proses klaim.',
  src:'OJK, Buku Seri Literasi Keuangan Perasuransian · OJK, SEOJK 5/2022 tentang Produk Asuransi yang Dikaitkan dengan Investasi · BPJS Kesehatan · Insurance Information Institute (III), Insurance Basics',
  sets:[
   {name:'Konsep Dasar', cards:[
    {q:'Apa <b>fungsi utama</b> asuransi?', a:'Mengalihkan risiko kerugian finansial besar yang jarang terjadi tetapi berdampak berat, seperti rawat inap, penyakit kritis, atau meninggalnya pencari nafkah, kepada perusahaan asuransi dengan membayar premi. Asuransi berfungsi sebagai proteksi, bukan alat untuk menjadi kaya.',
     tip:'Prinsip memilih risiko yang diasuransikan: dampak finansialnya besar dan tidak sanggup ditanggung sendiri.'},
    {q:'Apa arti <b>premi, polis, uang pertanggungan, dan pengecualian</b>?', a:'Istilah ini muncul di setiap produk asuransi dan perlu dipahami sebelum menandatangani.',
     pts:['Premi: biaya berkala yang dibayar pemegang polis.','Polis: kontrak berisi hak dan kewajiban kedua pihak.','Uang pertanggungan: nilai manfaat yang dibayarkan saat klaim disetujui.','Pengecualian: kondisi yang tidak ditanggung, misalnya penyakit bawaan tertentu.','Masa tunggu: periode setelah polis aktif ketika manfaat tertentu belum bisa diklaim.','Free look period: masa untuk mempelajari polis dan membatalkannya dengan pengembalian premi sesuai ketentuan.']},
    {q:'Apa urutan <b>prioritas proteksi</b>?', a:'Umumnya dimulai dari jaminan kesehatan dasar (BPJS Kesehatan), lalu asuransi jiwa bila ada tanggungan, kemudian asuransi tambahan seperti kesehatan swasta, penyakit kritis, dan properti. Proteksi kendaraan dan perjalanan dipilih sesuai kebutuhan.',
     ex:'Lajang tanpa tanggungan: cukup BPJS Kesehatan plus dana darurat. Pencari nafkah dengan dua anak: tambah asuransi jiwa berjangka dan pertimbangkan asuransi kesehatan tambahan.'}
   ]},
   {name:'Jenis & Kebutuhan Proteksi', cards:[
    {q:'Apa beda asuransi jiwa <b>berjangka</b>, <b>seumur hidup</b>, dan <b>unit link</b>?', a:'Asuransi jiwa berjangka (term life) memberi proteksi murni untuk periode tertentu dengan premi relatif murah. Asuransi seumur hidup (whole life) melindungi sampai usia lanjut dengan premi lebih mahal. Unit link (Produk Asuransi yang Dikaitkan dengan Investasi atau PAYDI) menggabungkan proteksi dan investasi, preminya lebih mahal, dan hasil investasinya tidak dijamin.',
     pts:['Prinsip "beli berjangka, investasikan sisanya" sering dianjurkan untuk memisahkan proteksi dan investasi.','Melalui SEOJK 5/2022, OJK mewajibkan perusahaan menjelaskan manfaat, biaya, dan risiko unit link secara jelas sebelum polis dibeli.']},
    {q:'Berapa <b>uang pertanggungan jiwa</b> yang memadai?', a:'Panduan cepat: sekitar 10 kali penghasilan tahunan. Cara yang lebih teliti adalah metode kebutuhan: jumlahkan biaya hidup tanggungan selama beberapa tahun, sisa utang, dan dana pendidikan anak, lalu kurangi aset yang sudah ada.',
     ex:'Biaya hidup keluarga Rp6 juta per bulan selama 10 tahun (Rp720 juta) + sisa KPR Rp300 juta + dana pendidikan Rp200 juta − aset Rp120 juta = sekitar Rp1,1 miliar.'},
    {q:'Apa yang perlu dicek pada <b>asuransi kesehatan</b> swasta?', a:'Bandingkan manfaat, bukan hanya premi.',
     pts:['Sistem penggantian: cashless (langsung di rumah sakit rekanan) atau reimbursement.','Limit kamar per hari dan limit tahunan.','Skema inner limit (batas per jenis biaya) atau as charged (sesuai tagihan).','Masa tunggu penyakit tertentu dan pengecualian kondisi yang sudah ada.','Fitur koordinasi manfaat dengan BPJS Kesehatan.']}
   ]},
   {name:'Membeli & Klaim', cards:[
    {q:'Apa yang dicek <b>sebelum membeli</b> polis?', a:'Pastikan perusahaan dan agen berizin serta diawasi OJK, pahami ringkasan informasi produk dan layanan (RIPLAY), baca pengecualian polis, serta ukur premi terhadap anggaran. Isi formulir kesehatan dengan jujur karena data yang tidak benar bisa menjadi alasan klaim ditolak.',
     warn:'Jangan membeli asuransi hanya karena hadiah atau desakan kenalan. Premi adalah komitmen jangka panjang.'},
    {q:'Bagaimana agar <b>klaim lancar</b>?', a:'Klaim sering ditolak karena dokumen tidak lengkap, terlambat dilaporkan, atau kondisi termasuk pengecualian.',
     pts:['Simpan polis dan kartu peserta di tempat mudah dijangkau, beri tahu keluarga.','Laporkan klaim sesuai batas waktu di polis.','Siapkan resume medis, kuitansi asli, dan formulir klaim.','Bila sengketa tidak selesai, ajukan ke Lembaga Alternatif Penyelesaian Sengketa Sektor Jasa Keuangan (LAPS SJK).']}
   ]}
  ]},

 {id:'pensiun', title:'Dana Pensiun', cat:'wajib', img:'elderly',
  desc:'Menyiapkan penghasilan pengganti setelah berhenti bekerja: menghitung kebutuhan, memahami JHT, JP, dan DPLK, serta strategi menjelang pensiun.',
  src:'OJK, Buku Seri Literasi Keuangan Dana Pensiun · BPJS Ketenagakerjaan, Program JHT dan JP · OJK, Roadmap Pengembangan dan Penguatan Dana Pensiun · OECD, Pensions at a Glance',
  sets:[
   {name:'Kebutuhan Pensiun', cards:[
    {q:'Berapa <b>dana</b> yang dibutuhkan saat pensiun?', a:'Panduan umum: penghasilan saat pensiun sekitar 70 sampai 80% dari pengeluaran menjelang pensiun. Kalikan dengan perkiraan lama masa pensiun dan sesuaikan dengan inflasi. Biaya kesehatan biasanya naik di usia lanjut sehingga perlu diperhitungkan terpisah.',
     ex:'Pengeluaran sekarang Rp8 juta per bulan, pensiun 25 tahun lagi, inflasi 3%: kebutuhan bulanan saat pensiun sekitar 8 × 0,75 × 1,03²⁵ ≈ Rp12,6 juta.'},
    {q:'Apa itu <b>replacement ratio</b>?', a:'Perbandingan penghasilan saat pensiun dengan penghasilan terakhir saat bekerja. OECD merekomendasikan tingkat penggantian yang memadai agar standar hidup tidak turun drastis. Di Indonesia, banyak pekerja hanya mengandalkan JHT sehingga rasio penggantiannya rendah.',
     f:'Replacement ratio = Penghasilan pensiun ÷ Penghasilan terakhir × 100%'},
    {q:'Apa itu <b>aturan 4%</b>?', a:'Panduan dari riset di Amerika Serikat (Bengen, Trinity Study): dana pensiun yang terdiversifikasi dapat ditarik sekitar 4% per tahun, disesuaikan inflasi, dengan peluang besar bertahan sekitar 30 tahun. Panduan ini dipakai untuk memperkirakan besar dana yang perlu dikumpulkan.',
     f:'Dana pensiun yang dibutuhkan ≈ Kebutuhan tahunan ÷ 4% = Kebutuhan tahunan × 25',
     ex:'Kebutuhan Rp150 juta per tahun saat pensiun: dana sekitar Rp3,75 miliar.',
     warn:'Aturan 4% berasal dari data pasar Amerika. Gunakan sebagai gambaran, bukan kepastian.'}
   ]},
   {name:'Program Pensiun', cards:[
    {q:'Apa beda <b>JHT</b> dan <b>JP</b> BPJS Ketenagakerjaan?', a:'Jaminan Hari Tua (JHT) adalah tabungan yang dibayarkan sekaligus saat peserta mencapai usia pensiun atau memenuhi syarat lain. Iurannya 5,7% dari upah (3,7% pemberi kerja, 2% pekerja). Jaminan Pensiun (JP) memberi manfaat bulanan bagi peserta yang memenuhi masa iur minimal, dengan iuran 3% (2% pemberi kerja, 1% pekerja).',
     tip:'Cek saldo JHT secara berkala lewat aplikasi resmi BPJS Ketenagakerjaan (JMO).'},
    {q:'Apa itu <b>DPPK</b> dan <b>DPLK</b>?', a:'Dana Pensiun Pemberi Kerja (DPPK) dibentuk perusahaan untuk karyawannya. Dana Pensiun Lembaga Keuangan (DPLK) dikelola bank atau perusahaan asuransi jiwa dan bisa diikuti siapa pun secara mandiri, termasuk pekerja lepas. Peserta DPLK bisa memilih paket investasi (pasar uang, pendapatan tetap, saham, atau campuran).',
     pts:['Iuran ke DPLK yang dibayar pekerja sendiri dapat mengurangi penghasilan kena pajak sesuai ketentuan.','Dana DPLK tidak bisa ditarik sembarangan sebelum usia pensiun, sehingga disiplin lebih terjaga.']},
    {q:'Bolehkah dana pensiun <b>dipakai lebih awal</b>?', a:'Sebaiknya tidak. Penarikan dini memotong efek bunga majemuk dan membuat target pensiun sulit tercapai. Untuk kebutuhan mendesak, gunakan dana darurat.',
     ex:'Menarik Rp50 juta di usia 35 tahun dengan asumsi imbal hasil 7% per tahun sama dengan kehilangan sekitar Rp270 juta di usia 60 tahun.'}
   ]},
   {name:'Strategi Sepanjang Karier', cards:[
    {q:'Kenapa harus mulai <b>sejak muda</b>?', a:'Semakin awal mulai, semakin panjang waktu bunga majemuk bekerja, sehingga setoran bulanan yang dibutuhkan jauh lebih kecil.',
     ex:'Target Rp2 miliar di usia 60 dengan imbal hasil 8% per tahun. Mulai usia 25: sekitar Rp870 ribu per bulan. Mulai usia 40: sekitar Rp3,4 juta per bulan.'},
    {q:'Bagaimana mengatur investasi <b>menjelang pensiun</b>?', a:'Sekitar 5 sampai 10 tahun sebelum pensiun, kurangi porsi aset berisiko secara bertahap. Siapkan dana kas untuk 1 sampai 2 tahun pertama pensiun agar tidak terpaksa menjual aset saat pasar turun.',
     pts:['Lunasi utang sebelum pensiun, terutama KPR.','Siapkan proteksi kesehatan yang tetap berlaku setelah tidak bekerja.','Rencanakan sumber penghasilan: JP, anuitas, kupon SBN, sewa properti.']}
   ]}
  ]},

 {id:'ilegal', title:'Waspada Investasi Ilegal', cat:'wajib', img:'t_ilegal',
  desc:'Mengenali ciri penawaran investasi dan pinjaman ilegal, memahami cara kerja skema Ponzi, memeriksa legalitas, serta melapor.',
  src:'OJK, Satgas Pemberantasan Aktivitas Keuangan Ilegal (Satgas PASTI) · OJK, Kontak OJK 157 · U.S. SEC Investor.gov, Ponzi Schemes · FINRA, Investment Fraud',
  sets:[
   {name:'Kenali Cirinya', cards:[
    {q:'Apa <b>ciri umum</b> investasi ilegal?', a:'Penawaran ilegal cenderung punya pola yang berulang dari waktu ke waktu.',
     pts:['Menjanjikan imbal hasil tinggi dan pasti dalam waktu singkat.','Mengklaim tanpa risiko.','Memberi bonus besar untuk merekrut anggota baru.','Izin usahanya tidak jelas atau hanya izin umum seperti NIB atau akta pendirian.','Mendesak untuk segera bergabung.','Memakai tokoh terkenal sebagai promosi.']},
    {q:'Apa itu prinsip <b>2L</b>?', a:'Legal: pastikan lembaga dan produknya berizin dari otoritas yang berwenang, misalnya OJK untuk produk jasa keuangan. Logis: pastikan imbal hasil yang ditawarkan masuk akal dan sebanding dengan risikonya.',
     ex:'Tawaran 10% per bulan setara lebih dari 200% per tahun bila dimajemukkan, sementara deposito memberi beberapa persen per tahun. Tawaran itu tidak logis.'},
    {q:'Bagaimana <b>skema Ponzi</b> bekerja?', a:'Skema yang membayar "keuntungan" anggota lama memakai setoran anggota baru, bukan dari usaha nyata. Pembayaran awal lancar sehingga menumbuhkan kepercayaan dan testimoni. Skema pasti runtuh ketika anggota baru berhenti bertambah, dan sebagian besar peserta kehilangan dana.',
     pts:['Skema piramida mirip, tetapi keuntungan utamanya dari biaya rekrutmen.','Varian modern: robot trading, arisan online berbunga, "investasi" aplikasi berkedok kerja paruh waktu.'],
     warn:'Pencairan pertama yang lancar justru bagian dari jebakan.'}
   ]},
   {name:'Cek & Lapor', cards:[
    {q:'Bagaimana <b>mengecek legalitas</b>?', a:'Cek daftar entitas berizin di situs OJK, hubungi Kontak OJK 157 (telepon) atau WhatsApp 081 157 157 157. Untuk produk pasar modal, pastikan perusahaan efek dan manajer investasi terdaftar. Untuk pinjaman daring, pastikan berizin sebagai LPBBTI.',
     tip:'Cek nama perusahaan secara lengkap, karena penipu sering meniru nama yang mirip dengan perusahaan berizin.'},
    {q:'Apa itu <b>Satgas PASTI</b>?', a:'Satuan Tugas Pemberantasan Aktivitas Keuangan Ilegal yang dikoordinasikan OJK bersama sejumlah kementerian dan lembaga, termasuk Kepolisian, Kementerian Komunikasi dan Digital, dan Bank Indonesia. Satgas memblokir situs dan aplikasi ilegal serta mengumumkan daftar entitas ilegal secara berkala.'},
    {q:'Apa yang dilakukan saat menerima <b>tawaran mencurigakan</b>?', a:'Jangan transfer dana, jangan berikan data pribadi atau kode OTP, simpan buktinya, lalu laporkan ke Kontak OJK 157 atau Satgas PASTI. Jika sudah terlanjur mentransfer, segera laporkan ke bank dan Indonesia Anti-Scam Centre (IASC).',
     pts:['Ingatkan keluarga dan rekan yang ikut diajak.','Jangan tergiur "pemulihan dana" berbayar, karena itu sering menjadi penipuan lanjutan.']}
   ]}
  ]}
);

TOPICS.push(
 {id:'moneter', title:'Inflasi, Suku Bunga & Peran BI', cat:'opsional', img:'t_moneter',
  desc:'Memahami inflasi, BI-Rate dan cara kebijakan moneter merambat ke cicilan, deposito, dan nilai tukar, serta dampaknya bagi keuangan rumah tangga.',
  src:'Bank Indonesia, Kebijakan Moneter dan Mekanisme Transmisi (bi.go.id) · Bank Indonesia, Laporan Kebijakan Moneter · BPS, Indeks Harga Konsumen · IMF, Back to Basics: What Is Inflation?',
  sets:[
   {name:'Inflasi', cards:[
    {q:'Apa itu <b>inflasi</b> dan bagaimana mengukurnya?', a:'Inflasi adalah kenaikan harga barang dan jasa secara umum dan terus-menerus. Di Indonesia, inflasi diukur oleh BPS memakai Indeks Harga Konsumen (IHK) dari sekeranjang barang dan jasa yang biasa dikonsumsi rumah tangga. Bank Indonesia dan Pemerintah menetapkan sasaran inflasi bersama, yaitu 2,5% ± 1%, termasuk untuk tahun 2026 dan 2027.',
     f:'Inflasi tahunan = (IHK tahun ini − IHK tahun lalu) ÷ IHK tahun lalu × 100%',
     ex:'IHK naik dari 105 menjadi 107,6: inflasi sekitar 2,5%. Belanja bulanan Rp5 juta tahun lalu kini butuh sekitar Rp5,12 juta untuk barang yang sama.'},
    {q:'Apa saja <b>komponen</b> dan penyebab inflasi?', a:'BI mengelompokkan inflasi menjadi tiga komponen agar sumbernya lebih mudah dibaca.',
     pts:['Inflasi inti: dipengaruhi permintaan dan ekspektasi, relatif stabil.','Harga bergejolak (volatile food): bahan pangan seperti cabai dan beras, dipengaruhi cuaca dan pasokan.','Harga diatur pemerintah (administered prices): BBM, tarif listrik, tarif angkutan.','Penyebab umum: tarikan permintaan (demand pull), dorongan biaya (cost push), dan inflasi impor akibat pelemahan nilai tukar.']},
    {q:'Bagaimana inflasi memengaruhi <b>keuangan pribadi</b>?', a:'Inflasi menggerus daya beli uang tunai dan tabungan berbunga rendah. Sebaliknya, inflasi meringankan beban riil utang berbunga tetap karena nilai cicilan tidak berubah sementara penghasilan nominal cenderung naik.',
     pts:['Naikkan target tujuan keuangan sesuai perkiraan inflasi.','Pastikan imbal hasil investasi jangka panjang di atas inflasi.','Perhatikan inflasi pendidikan dan kesehatan yang biasanya lebih tinggi dari inflasi umum.']}
   ]},
   {name:'BI-Rate & Transmisi', cards:[
    {q:'Apa itu <b>BI-Rate</b>?', a:'Suku bunga kebijakan Bank Indonesia yang diputuskan dalam Rapat Dewan Gubernur (RDG) setiap bulan. Sejak 21 Desember 2023, BI kembali memakai nama BI-Rate, dengan operasional tetap mengacu pada reverse repo tenor 7 hari. BI menaikkan suku bunga untuk meredam inflasi atau menstabilkan rupiah, dan menurunkannya untuk mendorong pertumbuhan ekonomi.'},
    {q:'Bagaimana kebijakan BI <b>merambat</b> ke masyarakat?', a:'Perubahan BI-Rate tidak langsung mengubah semua harga. Efeknya merambat melalui beberapa jalur dengan jeda waktu, biasanya beberapa bulan.',
     pts:['Jalur suku bunga: bunga pasar uang, deposito, lalu bunga kredit ikut menyesuaikan.','Jalur kredit: bank lebih atau kurang agresif menyalurkan pinjaman.','Jalur nilai tukar: perbedaan suku bunga memengaruhi aliran modal dan rupiah.','Jalur harga aset: harga obligasi dan saham bereaksi.','Jalur ekspektasi: masyarakat dan pelaku usaha menyesuaikan perkiraan inflasi.']},
    {q:'Apa dampak kenaikan atau penurunan suku bunga bagi <b>rumah tangga</b>?', a:'Arah suku bunga memengaruhi keputusan menabung, berutang, dan berinvestasi.',
     pts:['Bunga naik: bunga deposito membaik, cicilan KPR berbunga mengambang (floating) bisa naik, harga obligasi lama cenderung turun.','Bunga turun: biaya kredit lebih murah, harga obligasi lama cenderung naik, bunga deposito menurun.'],
     ex:'KPR Rp500 juta tenor 20 tahun. Bunga naik dari 8% ke 10% membuat cicilan naik dari sekitar Rp4,18 juta menjadi Rp4,83 juta per bulan.',
     tip:'Saat mengambil KPR, pahami kapan masa bunga tetap (fixed) berakhir dan hitung cicilan jika bunga floating naik 2 sampai 3 poin.'}
   ]},
   {name:'Nilai Tukar & Stabilitas', cards:[
    {q:'Bagaimana <b>nilai tukar rupiah</b> memengaruhi kita?', a:'Rupiah yang melemah membuat barang impor, bahan baku impor, dan biaya perjalanan ke luar negeri lebih mahal, yang bisa mendorong inflasi. Bagi eksportir, pelemahan rupiah dapat menambah pendapatan dalam rupiah.',
     ex:'Biaya kuliah di luar negeri USD20.000 per tahun. Kurs Rp15.500 berarti Rp310 juta, kurs Rp16.500 berarti Rp330 juta.',
     tip:'Untuk kebutuhan valas yang pasti (kuliah, umrah, liburan), cicil pembelian valas secara bertahap untuk meratakan kurs.'},
    {q:'Apa peran <b>BI, OJK, LPS, dan Kemenkeu</b> dalam stabilitas sistem keuangan?', a:'Keempat lembaga tergabung dalam Komite Stabilitas Sistem Keuangan (KSSK). BI menjaga stabilitas nilai rupiah, sistem pembayaran, dan kebijakan makroprudensial. OJK mengatur dan mengawasi lembaga jasa keuangan serta melindungi konsumen. LPS menjamin simpanan dan menangani bank bermasalah. Kementerian Keuangan mengelola fiskal termasuk penerbitan SBN.'}
   ]}
  ]},

 {id:'reksadana', title:'Reksa Dana & Obligasi', cat:'opsional', img:'t_reksadana',
  desc:'Mengenal wadah investasi yang dikelola profesional dan surat utang untuk pemula: jenis, biaya, cara membaca kinerja, serta SBN ritel.',
  src:'OJK, Buku Seri Literasi Keuangan Pasar Modal · Kemenkeu DJPPR, SBN Ritel (djppr.kemenkeu.go.id) · KSEI, AKSes · Investopedia, Mutual Funds dan Bond Basics · CFA Institute, Fixed Income',
  sets:[
   {name:'Reksa Dana', cards:[
    {q:'Apa itu <b>reksa dana</b> dan bagaimana cara kerjanya?', a:'Wadah untuk menghimpun dana dari banyak investor yang dikelola manajer investasi ke dalam portofolio efek. Dana investor disimpan di bank kustodian, bukan di rekening manajer investasi, sehingga lebih terlindungi. Investor memiliki unit penyertaan yang nilainya mengikuti NAB per unit.',
     pts:['Manajer investasi: mengelola portofolio, berizin OJK.','Bank kustodian: menyimpan aset dan menghitung NAB.','Agen penjual (APERD): aplikasi atau bank tempat membeli, juga wajib berizin.']},
    {q:'Apa saja <b>jenis reksa dana</b> dan kapan cocok dipakai?', a:'Jenis ditentukan oleh isi portofolio. Pilih sesuai jangka waktu tujuan dan profil risiko.',
     pts:['Pasar uang: deposito dan surat utang di bawah 1 tahun. Risiko terendah, untuk dana darurat atau tujuan di bawah 1 tahun.','Pendapatan tetap: minimal 80% obligasi. Untuk 1 sampai 3 tahun.','Campuran: kombinasi saham, obligasi, pasar uang. Untuk 3 sampai 5 tahun.','Saham: minimal 80% saham. Untuk di atas 5 tahun.','Indeks dan ETF: mengikuti indeks tertentu dengan biaya lebih rendah.','Terproteksi: pokok dilindungi pada jatuh tempo dengan syarat tertentu.']},
    {q:'Bagaimana membaca <b>NAB per unit</b> dan menghitung untung?', a:'NAB per unit adalah harga satu unit reksa dana pada hari itu. Keuntungan berasal dari kenaikan NAB per unit. Pembelian sebelum batas waktu (umumnya pukul 13.00 WIB) memakai NAB hari itu.',
     f:'Imbal hasil = (NAB jual − NAB beli) ÷ NAB beli × 100%',
     ex:'Beli Rp5 juta saat NAB Rp1.250 (4.000 unit). Setahun kemudian NAB Rp1.350. Nilai menjadi Rp5,4 juta, imbal hasil 8%.'},
    {q:'Apa yang dicek sebelum memilih <b>produk reksa dana</b>?', a:'Jangan memilih hanya dari kinerja satu tahun terakhir. Kinerja masa lalu tidak menjamin kinerja masa depan.',
     pts:['Kinerja 3 sampai 5 tahun dibanding tolok ukurnya (benchmark).','Total biaya (expense ratio) serta biaya pembelian dan penjualan.','Besar dana kelolaan (AUM) dan konsistensi manajer investasi.','Fund fact sheet dan prospektus yang wajib tersedia.'],
     tip:'Cek kepemilikan unit reksa dana kamu lewat AKSes KSEI untuk memastikan tercatat resmi.'}
   ]},
   {name:'Obligasi', cards:[
    {q:'Apa itu <b>obligasi</b>?', a:'Surat utang yang diterbitkan pemerintah atau perusahaan. Pemegangnya menerima kupon (bunga) secara berkala dan pokoknya dikembalikan saat jatuh tempo. Obligasi korporasi diberi peringkat oleh lembaga pemeringkat seperti Pefindo. Makin rendah peringkat, makin tinggi risiko gagal bayar dan biasanya makin tinggi kuponnya.'},
    {q:'Kenapa harga obligasi <b>berlawanan</b> dengan suku bunga?', a:'Jika suku bunga pasar naik, obligasi baru menawarkan kupon lebih tinggi sehingga obligasi lama berkupon rendah kurang menarik dan harganya turun. Sebaliknya, saat suku bunga turun, harga obligasi lama naik. Makin panjang sisa tenor, makin sensitif harganya (konsep durasi).',
     ex:'Obligasi kupon 6% dibeli pada harga 100. Suku bunga pasar naik ke 7%: harganya bisa turun di bawah 100. Jika dipegang sampai jatuh tempo, investor tetap menerima kupon dan pokok penuh.'},
    {q:'Apa itu <b>yield to maturity</b>?', a:'Perkiraan total imbal hasil tahunan jika obligasi dibeli pada harga sekarang dan dipegang sampai jatuh tempo, termasuk kupon dan selisih harga. YTM berguna untuk membandingkan obligasi dengan harga dan kupon berbeda.',
     f:'Current yield = Kupon tahunan ÷ Harga pasar × 100%',
     ex:'Kupon Rp70 ribu per tahun, harga pasar Rp950 ribu (nominal Rp1 juta): current yield 7,4%, dan YTM lebih tinggi lagi karena ada tambahan selisih Rp50 ribu saat jatuh tempo.'}
   ]},
   {name:'SBN Ritel', cards:[
    {q:'Apa itu <b>SBN ritel</b>?', a:'Surat Berharga Negara yang dijual khusus untuk investor individu warga negara Indonesia melalui mitra distribusi resmi. Pokok dan kuponnya dijamin negara sesuai undang-undang. Pembelian mulai Rp1 juta.',
     pts:['ORI: konvensional, kupon tetap, bisa diperdagangkan.','SR (Sukuk Ritel): syariah, imbalan tetap, bisa diperdagangkan.','SBR: konvensional, kupon mengambang dengan batas bawah, tidak bisa diperdagangkan, bisa dicairkan sebagian lebih awal (early redemption) sampai 50% sesuai jadwal.','ST (Sukuk Tabungan): versi syariah dari SBR.']},
    {q:'Bagaimana kupon <b>floating with floor</b> pada SBR dan ST bekerja?', a:'Kupon mengikuti suku bunga acuan (BI-Rate) ditambah spread tertentu dan disesuaikan berkala. Jika acuan naik, kupon ikut naik. Jika acuan turun, kupon tidak akan lebih rendah dari kupon awal yang menjadi batas bawah.',
     tip:'Kupon SBN dikenai pajak final 10%, lebih rendah dari pajak bunga deposito 20%.'}
   ]}
  ]},

 {id:'saham', title:'Saham: Pengantar', cat:'opsional', img:'trading',
  desc:'Dasar kepemilikan perusahaan lewat saham: sumber keuntungan, mekanisme perdagangan di BEI, biaya, aksi korporasi, dan cara memulai dengan aman.',
  src:'IDX, Panduan Investor Saham dan Sekolah Pasar Modal (idx.co.id) · OJK, Buku Saku Pasar Modal · KSEI, Sistem SID dan AKSes · U.S. SEC Investor.gov, Stocks · Benjamin Graham, The Intelligent Investor',
  sets:[
   {name:'Kenalan dengan Saham', cards:[
    {q:'Apa itu <b>saham</b> dan dari mana keuntungannya?', a:'Saham adalah bukti kepemilikan atas sebagian perusahaan. Keuntungan datang dari dua sumber: dividen (bagian laba yang dibagikan) dan capital gain (kenaikan harga). Risikonya adalah capital loss saat harga turun, dan dalam kondisi terburuk perusahaan dapat dihapus dari bursa (delisting).',
     ex:'Beli 1 lot (100 lembar) di harga Rp2.000, menerima dividen Rp80 per lembar, lalu menjual di Rp2.300. Dividen Rp8.000 + capital gain Rp30.000 = Rp38.000 atau 19% sebelum biaya.'},
    {q:'Apa itu <b>dividen yield</b> dan <b>tanggal-tanggal dividen</b>?', a:'Dividen yield adalah dividen per tahun dibagi harga saham. Untuk berhak atas dividen, investor harus memiliki saham sebelum tanggal ex-dividen (cum date adalah hari terakhir membeli dengan hak dividen).',
     f:'Dividen yield = Dividen per lembar ÷ Harga saham × 100%',
     pts:['Cum date: hari terakhir beli dengan hak dividen.','Ex date: mulai hari ini membeli tidak lagi mendapat dividen, harga biasanya turun sebesar dividen.','Recording date: pencatatan pemegang saham.','Payment date: dividen masuk ke RDN.']},
    {q:'Apa saja <b>jenis saham</b> berdasarkan karakter?', a:'Pengelompokan ini membantu memahami perilaku harga.',
     pts:['Blue chip: perusahaan besar, mapan, likuid, sering masuk indeks LQ45 atau IDX30.','Growth: pertumbuhan laba tinggi, dividen kecil, valuasi cenderung mahal.','Value: dihargai di bawah nilai wajarnya menurut analisis fundamental.','Defensif: kinerja relatif stabil saat ekonomi melambat, misalnya barang konsumsi pokok.','Siklikal: kinerjanya naik turun mengikuti siklus ekonomi, misalnya komoditas dan properti.']}
   ]},
   {name:'Mekanisme Bursa', cards:[
    {q:'Bagaimana cara <b>mulai membeli</b> saham?', a:'Buka rekening efek di perusahaan sekuritas berizin OJK dan anggota bursa. Investor akan mendapat Single Investor Identification (SID) dari KSEI dan Rekening Dana Nasabah (RDN) atas nama sendiri di bank untuk menampung dana transaksi. Transaksi saham diselesaikan T+2, artinya dana dan saham berpindah dua hari bursa setelah transaksi.',
     tip:'Pastikan kamu menerima kartu AKSes atau akses ke akses.ksei.co.id untuk mengecek saham atas namamu secara independen.'},
    {q:'Berapa <b>satuan</b> dan <b>biaya</b> transaksi saham?', a:'Satuan perdagangan adalah 1 lot = 100 lembar. Biaya transaksi berbeda antar sekuritas, umumnya sekitar 0,15% saat beli dan 0,25% saat jual (sudah termasuk pajak penjualan saham 0,1%).',
     ex:'Beli 10 lot di Rp1.500 = Rp1,5 juta, biaya beli 0,15% = Rp2.250. Jual di Rp1.600 = Rp1,6 juta, biaya jual 0,25% = Rp4.000. Untung bersih Rp93.750.'},
    {q:'Apa itu <b>ARA</b>, <b>ARB</b>, dan fraksi harga?', a:'Auto Rejection Atas dan Bawah adalah batas maksimal kenaikan dan penurunan harga saham dalam satu hari perdagangan yang ditetapkan BEI berdasarkan rentang harga. Batasnya dapat diubah oleh bursa sesuai kondisi pasar. Fraksi harga adalah kelipatan perubahan harga yang diizinkan (misalnya Rp1, Rp2, Rp5, Rp10, Rp25 tergantung rentang harga).',
     ex:'Per pengumuman BEI September 2026, ARA untuk saham di atas Rp200 sampai Rp5.000 adalah 25%, sedangkan ARB 15% sampai akhir 2026 dan direncanakan kembali simetris dengan ARA mulai Januari 2027.',
     tip:'Cek ketentuan terbaru di idx.co.id karena aturan ARA/ARB bisa berubah.'},
    {q:'Apa itu <b>IHSG</b> dan indeks lainnya?', a:'Indeks Harga Saham Gabungan mencerminkan pergerakan harga seluruh saham tercatat di BEI. Ada juga indeks lain untuk kelompok tertentu.',
     pts:['LQ45: 45 saham paling likuid dengan kapitalisasi besar.','IDX30 dan IDX80: kelompok saham likuid dan berfundamental baik.','ISSI dan JII: indeks saham syariah.','IDX Sektoral: indeks per sektor seperti keuangan dan energi.']}
   ]},
   {name:'Aksi Korporasi & Kebiasaan Aman', cards:[
    {q:'Apa saja <b>aksi korporasi</b> yang perlu dipahami?', a:'Aksi korporasi dapat mengubah jumlah atau harga saham yang dimiliki.',
     pts:['IPO: penawaran saham perdana kepada publik.','Right issue: penawaran saham baru kepada pemegang saham lama.','Stock split: memecah harga per lembar agar lebih terjangkau, nilai total tidak berubah.','Reverse split: kebalikan stock split.','Buyback: perusahaan membeli kembali sahamnya sendiri.']},
    {q:'Kebiasaan apa yang membuat investor saham <b>bertahan lama</b>?', a:'Banyak investor pemula rugi karena membeli berdasarkan rumor dan memakai uang yang seharusnya untuk kebutuhan lain.',
     pts:['Gunakan dana dingin, yaitu dana yang tidak dibutuhkan setidaknya 5 tahun.','Pahami bisnis perusahaan sebelum membeli.','Batasi porsi per saham, misalnya maksimal 10 sampai 20% portofolio.','Hindari membeli karena "rekomendasi grup" tanpa analisis.','Catat alasan membeli dan kondisi untuk menjual.'],
     warn:'Waspada praktik "pom-pom" dan goreng saham: harga dinaikkan beramai-ramai lalu dijual ke pembeli yang terlambat.'}
   ]}
  ]},

 {id:'funda', title:'Analisis Fundamental', cat:'opsional', img:'magnifier',
  desc:'Menilai kesehatan dan nilai wajar perusahaan dari laporan keuangan, rasio kinerja, valuasi, dan kualitas bisnisnya sebelum memutuskan membeli saham.',
  src:'IDX, Laporan Keuangan dan Tahunan Emiten · OJK, Buku Saku Pasar Modal · CFA Institute, Equity Investments dan Financial Statement Analysis · Aswath Damodaran, Investment Valuation · Benjamin Graham, The Intelligent Investor',
  sets:[
   {name:'Membaca Laporan Keuangan', cards:[
    {q:'Apa isi <b>tiga laporan keuangan</b> utama?', a:'Ketiganya saling terhubung dan sebaiknya dibaca bersama, minimal untuk 3 sampai 5 tahun terakhir agar terlihat tren.',
     pts:['Neraca: aset, liabilitas, dan ekuitas pada satu tanggal. Menunjukkan kekuatan keuangan.','Laba rugi: pendapatan, beban, dan laba dalam satu periode. Menunjukkan profitabilitas.','Arus kas: kas dari operasi, investasi, dan pendanaan. Menunjukkan apakah laba benar menjadi uang tunai.'],
     tip:'Laporan keuangan dan laporan tahunan emiten tersedia gratis di idx.co.id dan situs hubungan investor perusahaan.'},
    {q:'Kenapa <b>arus kas operasi</b> penting?', a:'Laba bisa tercatat walau uangnya belum diterima, misalnya penjualan kredit yang belum dibayar pelanggan. Arus kas operasi yang positif, stabil, dan sejalan dengan laba bersih menunjukkan kualitas laba yang baik.',
     f:'Free cash flow = Arus kas operasi − Belanja modal (capex)',
     ex:'Laba bersih Rp500 miliar tetapi arus kas operasi negatif tiga tahun berturut-turut dan piutang terus membengkak. Ini tanda bahaya yang perlu diselidiki.'},
    {q:'Apa <b>tanda bahaya</b> (red flags) di laporan keuangan?', a:'Beberapa pola sering mendahului masalah besar.',
     pts:['Laba naik tetapi arus kas operasi terus negatif.','Piutang atau persediaan tumbuh jauh lebih cepat dari penjualan.','Utang meningkat tajam tanpa pertumbuhan pendapatan.','Opini auditor selain wajar tanpa pengecualian, atau sering berganti auditor.','Banyak transaksi dengan pihak berelasi.']}
   ]},
   {name:'Rasio Kinerja', cards:[
    {q:'Apa itu <b>ROE</b> dan bagaimana membacanya?', a:'Return on Equity mengukur kemampuan perusahaan menghasilkan laba dari modal pemegang saham. ROE tinggi dan konsisten (misalnya di atas 15% selama beberapa tahun) menandakan bisnis efisien. Periksa juga apakah ROE tinggi karena utang besar.',
     f:'ROE = Laba bersih ÷ Total ekuitas × 100%',
     ex:'Laba bersih Rp300 miliar, ekuitas Rp1,5 triliun: ROE 20%.',
     tip:'Analisis DuPont memecah ROE menjadi margin laba × perputaran aset × leverage untuk melihat sumber ROE.'},
    {q:'Apa itu <b>margin laba</b>?', a:'Margin menunjukkan berapa bagian dari penjualan yang tersisa sebagai laba di tiap tingkat. Bandingkan dengan pesaing di industri yang sama karena margin berbeda jauh antar industri.',
     pts:['Margin laba kotor = Laba kotor ÷ Pendapatan.','Margin laba operasi = Laba operasi ÷ Pendapatan.','Margin laba bersih = Laba bersih ÷ Pendapatan.'],
     ex:'Pendapatan Rp2 triliun, laba bersih Rp200 miliar: margin bersih 10%.'},
    {q:'Apa itu <b>DER</b> dan <b>current ratio</b>?', a:'Debt to Equity Ratio membandingkan total utang dengan modal sendiri. DER tinggi berarti perusahaan banyak dibiayai utang dan lebih rentan saat bunga naik. Current ratio membandingkan aset lancar dengan liabilitas lancar untuk melihat kemampuan membayar kewajiban jangka pendek.',
     f:'DER = Total liabilitas ÷ Total ekuitas · Current ratio = Aset lancar ÷ Liabilitas lancar',
     warn:'Bank dan perusahaan pembiayaan secara alami memiliki DER tinggi. Untuk sektor ini gunakan rasio khusus seperti CAR dan NPL.'}
   ]},
   {name:'Valuasi', cards:[
    {q:'Apa yang diukur <b>PER</b>?', a:'Price to Earnings Ratio menunjukkan berapa kali laba per saham yang dibayar investor. PER perlu dibandingkan dengan rata-rata historis perusahaan dan pesaing di sektor yang sama. PER rendah bisa berarti murah, tetapi juga bisa berarti pasar memperkirakan laba akan turun.',
     f:'PER = Harga saham ÷ Laba per saham (EPS)',
     ex:'Harga Rp4.000, EPS Rp400: PER 10 kali. Jika rata-rata sektor 15 kali dan fundamentalnya setara, saham ini relatif murah.'},
    {q:'Apa itu <b>PBV</b>?', a:'Price to Book Value membandingkan harga saham dengan nilai buku per saham. Berguna untuk perusahaan yang asetnya dominan seperti bank. PBV di bawah 1 berarti harga pasar lebih rendah dari nilai buku ekuitasnya, namun perlu dicek alasannya.',
     f:'PBV = Harga saham ÷ Nilai buku per saham',
     ex:'Harga Rp1.200, nilai buku per saham Rp1.500: PBV 0,8 kali.'},
    {q:'Apa itu <b>nilai intrinsik</b> dan <b>margin of safety</b>?', a:'Nilai intrinsik adalah perkiraan nilai wajar perusahaan berdasarkan kemampuannya menghasilkan kas di masa depan, misalnya dengan metode discounted cash flow (DCF). Margin of safety, konsep dari Benjamin Graham, adalah membeli jauh di bawah nilai intrinsik sebagai bantalan terhadap kesalahan perkiraan.',
     f:'Margin of safety = (Nilai intrinsik − Harga) ÷ Nilai intrinsik × 100%',
     ex:'Nilai intrinsik diperkirakan Rp5.000, harga Rp3.500: margin of safety 30%.',
     tip:'Valuasi adalah perkiraan, bukan kepastian. Gunakan asumsi yang konservatif.'}
   ]}
  ]},

 {id:'teknikal', title:'Analisis Teknikal', cat:'opsional', img:'t_teknikal',
  desc:'Membaca pola harga dan volume untuk menentukan waktu masuk dan keluar: candlestick, tren, support dan resistance, indikator populer, serta manajemen risiko.',
  src:'IDX, Sekolah Pasar Modal · John J. Murphy, Technical Analysis of the Financial Markets · CMT Association, Body of Knowledge · Investopedia, Technical Analysis (RSI, MACD, Bollinger Bands) · Steve Nison, Japanese Candlestick Charting Techniques',
  sets:[
   {name:'Candlestick & Pola', cards:[
    {q:'Apa informasi dalam satu <b>candlestick</b>?', a:'Satu batang candlestick merangkum empat harga dalam satu periode: pembukaan (open), tertinggi (high), terendah (low), dan penutupan (close). Badan (body) menunjukkan jarak open ke close. Ekor atau sumbu (shadow) menunjukkan harga tertinggi dan terendah.',
     pts:['Badan hijau atau putih: close lebih tinggi dari open (naik).','Badan merah atau hitam: close lebih rendah dari open (turun).','Ekor atas panjang: pembeli sempat mendorong naik, tetapi penjual menekan kembali.','Ekor bawah panjang: harga sempat jatuh, tetapi pembeli mengangkatnya kembali.'],
     ex:'Open Rp1.000, high Rp1.080, low Rp990, close Rp1.060: candle hijau dengan badan Rp60 dan ekor atas Rp20.'},
    {q:'Apa saja <b>pola candlestick</b> yang sering dipakai?', a:'Pola candlestick menggambarkan pertarungan pembeli dan penjual. Pola lebih bermakna jika muncul di area support atau resistance dan dikonfirmasi volume serta candle berikutnya.',
     pts:['Hammer: badan kecil di atas, ekor bawah panjang, muncul setelah penurunan. Sinyal potensi pembalikan naik.','Shooting star: kebalikan hammer, muncul setelah kenaikan. Potensi pembalikan turun.','Doji: open dan close hampir sama, menandakan keraguan pasar.','Bullish engulfing: candle hijau besar menelan seluruh badan candle merah sebelumnya.','Bearish engulfing: kebalikannya, candle merah besar menelan candle hijau sebelumnya.']},
    {q:'Apa itu pola <b>chart</b> klasik?', a:'Pola yang terbentuk dari banyak candle dalam rentang waktu lebih panjang.',
     pts:['Double bottom (huruf W): dua kali gagal turun di level sama, potensi pembalikan naik saat menembus puncak di tengahnya.','Double top (huruf M): kebalikannya.','Head and shoulders: tiga puncak dengan puncak tengah tertinggi, pola pembalikan turun.','Triangle dan flag: pola konsolidasi sebelum harga melanjutkan tren.'],
     warn:'Pola bisa gagal. Selalu siapkan batas rugi.'}
   ]},
   {name:'Tren, Support & Resistance', cards:[
    {q:'Bagaimana mengenali <b>tren</b>?', a:'Prinsip utama analisis teknikal: harga bergerak dalam tren, dan tren cenderung berlanjut sampai ada tanda pembalikan.',
     pts:['Tren naik (uptrend): puncak dan lembah makin tinggi (higher high, higher low).','Tren turun (downtrend): puncak dan lembah makin rendah (lower high, lower low).','Sideways: harga bergerak mendatar dalam rentang tertentu.'],
     tip:'Mulai dari grafik mingguan untuk melihat tren besar, lalu grafik harian untuk mencari titik masuk.'},
    {q:'Apa itu <b>support</b> dan <b>resistance</b>?', a:'Support adalah area harga yang cenderung menahan penurunan karena banyak pembeli masuk. Resistance adalah area yang cenderung menahan kenaikan karena banyak penjual. Jika resistance ditembus dengan volume besar (breakout), area itu sering berubah peran menjadi support baru.',
     ex:'Saham tiga kali gagal menembus Rp2.500 lalu akhirnya ditutup di Rp2.560 dengan volume dua kali rata-rata. Rp2.500 kini berpotensi menjadi support. Jika harga kembali turun ke sekitar Rp2.500 dan bertahan (retest), itu menjadi konfirmasi.'},
    {q:'Apa peran <b>volume</b>?', a:'Volume menunjukkan kekuatan di balik pergerakan harga. Kenaikan harga dengan volume besar lebih meyakinkan dibanding kenaikan dengan volume tipis. Penurunan dengan volume besar menandakan tekanan jual yang kuat.',
     pts:['Breakout tanpa volume sering gagal (false breakout).','Volume yang mengecil saat tren berlangsung bisa menandakan tren melemah.']}
   ]},
   {name:'Indikator Populer', cards:[
    {q:'Bagaimana membaca <b>Moving Average</b> (MA)?', a:'Rata-rata harga penutupan dalam periode tertentu yang menghaluskan pergerakan harga. Simple MA memberi bobot sama, Exponential MA (EMA) memberi bobot lebih besar pada data terbaru.',
     f:'MA 5 hari = Jumlah 5 harga penutupan terakhir ÷ 5',
     pts:['Harga di atas MA 200 hari sering dianggap tren jangka panjang naik.','Golden cross: MA 50 memotong ke atas MA 200, sinyal penguatan.','Death cross: MA 50 memotong ke bawah MA 200, sinyal pelemahan.'],
     ex:'Harga penutupan 5 hari: 1.000, 1.020, 1.010, 1.040, 1.050. MA 5 = 5.120 ÷ 5 = 1.024. Harga terakhir 1.050 di atas MA, menandakan momentum naik jangka pendek.'},
    {q:'Bagaimana membaca <b>RSI</b>?', a:'Relative Strength Index (dikembangkan J. Welles Wilder) adalah indikator momentum berskala 0 sampai 100, umumnya memakai periode 14. Di atas 70 sering dianggap jenuh beli (overbought), di bawah 30 jenuh jual (oversold). Dalam tren kuat, RSI bisa bertahan lama di area ekstrem.',
     pts:['Divergensi bullish: harga membuat lembah lebih rendah, tetapi RSI membuat lembah lebih tinggi. Momentum turun melemah.','Divergensi bearish: harga membuat puncak lebih tinggi, tetapi RSI puncaknya lebih rendah.'],
     warn:'RSI di atas 70 bukan perintah jual otomatis. Gunakan bersama tren dan support/resistance.'},
    {q:'Apa itu <b>MACD</b> dan <b>Bollinger Bands</b>?', a:'MACD (Moving Average Convergence Divergence) mengukur selisih EMA 12 dan EMA 26, dengan garis sinyal EMA 9. Bollinger Bands terdiri dari MA 20 dan dua pita di atas dan bawahnya sejauh dua standar deviasi, menggambarkan volatilitas.',
     pts:['MACD memotong ke atas garis sinyal: momentum menguat.','MACD memotong ke bawah garis sinyal: momentum melemah.','Pita Bollinger menyempit (squeeze): volatilitas rendah, sering mendahului pergerakan besar.','Harga menyentuh pita atas dalam uptrend kuat adalah hal biasa, bukan otomatis sinyal jual.']}
   ]},
   {name:'Manajemen Risiko Trading', cards:[
    {q:'Apa itu <b>stop loss</b> dan <b>risk-reward ratio</b>?', a:'Stop loss adalah batas harga untuk keluar saat analisis ternyata salah, agar kerugian kecil dan terkendali. Risk-reward ratio membandingkan potensi rugi dengan potensi untung. Banyak trader mensyaratkan minimal 1:2.',
     ex:'Beli di Rp1.000 dengan stop loss Rp950 (risiko Rp50) dan target Rp1.100 (potensi Rp100). Rasio 1:2. Dengan rasio ini, menang 40% dari transaksi saja sudah bisa menghasilkan untung bersih.'},
    {q:'Berapa <b>ukuran posisi</b> yang aman?', a:'Aturan umum trader: risiko kerugian per transaksi maksimal 1 sampai 2% dari total modal.',
     f:'Jumlah lembar = (Modal × % risiko) ÷ (Harga beli − Stop loss)',
     ex:'Modal Rp20 juta, risiko 2% = Rp400 ribu. Beli Rp1.000, stop loss Rp950 (selisih Rp50): maksimal 8.000 lembar atau 80 lot.',
     warn:'Analisis teknikal tidak memberi kepastian. Trading jangka pendek memiliki risiko tinggi dan biaya transaksi yang menumpuk.'}
   ]}
  ]}
);

TOPICS.push(
 {id:'emas', title:'Emas & Komoditas', cat:'opsional', img:'t_emas',
  desc:'Mengenal emas sebagai pelindung nilai dan pelengkap portofolio: bentuk kepemilikan, biaya tersembunyi seperti spread, cara menyimpan, dan kapan emas cocok dipakai.',
  src:'World Gold Council, Gold as a Strategic Asset · OJK, Buku Seri Literasi Keuangan · Pegadaian dan Antam (Logam Mulia), Informasi Produk Emas · Investopedia, Investing in Gold',
  sets:[
   {name:'Emas sebagai Aset', cards:[
    {q:'Kenapa emas disebut <b>aset lindung nilai</b>?', a:'Harga emas cenderung naik dalam jangka panjang dan sering bertahan, bahkan naik, saat inflasi tinggi, krisis, atau pasar saham bergejolak. Karena itu emas dipakai untuk menjaga daya beli dan sebagai penyeimbang portofolio. Emas tidak memberi bunga atau dividen, sehingga keuntungannya hanya dari kenaikan harga.',
     tip:'Riset World Gold Council menunjukkan porsi emas sekitar 2 sampai 10% dapat membantu menurunkan fluktuasi portofolio yang terdiversifikasi.'},
    {q:'Apa itu <b>spread</b> dan kenapa penting?', a:'Spread adalah selisih harga jual (saat kita membeli) dan harga beli kembali atau buyback (saat kita menjual). Karena spread, emas yang baru dibeli langsung bernilai lebih rendah jika dijual hari itu. Harga emas perlu naik melebihi spread dulu sebelum kita untung.',
     f:'Spread (%) = (Harga jual − Harga buyback) ÷ Harga jual × 100%',
     ex:'Misalnya harga jual Rp2.000.000 per gram dan buyback Rp1.840.000 per gram. Spread 8%. Jika harga emas naik rata-rata 8% per tahun, butuh sekitar setahun hanya untuk menutup spread.'},
    {q:'Emas cocok untuk <b>tujuan apa</b>?', a:'Tujuan jangka menengah hingga panjang, misalnya menjaga nilai sebagian tabungan, dana pendidikan beberapa tahun lagi, atau dana haji dan umrah. Emas kurang cocok untuk dana darurat karena ada spread dan harganya bisa turun dalam jangka pendek.',
     warn:'Harga emas juga bisa turun signifikan. Antara 2012 dan 2015, harga emas dunia turun lebih dari 30%.'}
   ]},
   {name:'Cara Memiliki Emas', cards:[
    {q:'Apa saja <b>bentuk investasi</b> emas?', a:'Setiap bentuk punya kelebihan dan biaya yang berbeda.',
     pts:['Emas batangan (logam mulia): bersertifikat, spread lebih kecil dibanding perhiasan, perlu tempat simpan aman.','Perhiasan: ada ongkos pembuatan yang hilang saat dijual, lebih cocok sebagai perhiasan.','Tabungan emas: menabung mulai 0,01 gram di lembaga resmi seperti Pegadaian, bisa dicetak menjadi fisik.','Emas digital di platform: praktis, pastikan platform berizin dan emasnya disimpan di kustodian resmi.','Reksa dana atau ETF berbasis emas: terpapar harga emas tanpa menyimpan fisik.']},
    {q:'Apa yang diperhatikan saat membeli <b>emas batangan</b>?', a:'Beli dari penjual resmi, simpan sertifikat dan kemasannya dalam kondisi baik, perhatikan biaya penyimpanan, dan cek harga buyback sebelum membeli. Emas tanpa sertifikat atau kemasan rusak bisa dihargai lebih rendah saat dijual kembali.',
     tip:'Ukuran kecil (misalnya 1 sampai 5 gram) lebih fleksibel dijual sebagian, tetapi harga per gramnya biasanya sedikit lebih mahal.'},
    {q:'Apakah <b>emas digital</b> aman?', a:'Relatif aman jika platformnya berizin dan diawasi otoritas, emasnya disimpan di kustodian resmi, serta pemilik bisa mencetak atau menarik emasnya. Bandingkan spread, biaya penyimpanan, dan biaya cetak antar platform.',
     warn:'Waspada skema "investasi emas" yang menjanjikan imbal hasil tetap per bulan. Harga emas naik turun, sehingga janji imbal hasil tetap adalah tanda bahaya.'}
   ]},
   {name:'Komoditas Lain', cards:[
    {q:'Bagaimana dengan <b>komoditas</b> lain seperti perak atau minyak?', a:'Komoditas lain lebih volatil dan biasanya diperdagangkan lewat kontrak berjangka yang memakai leverage. Perdagangan berjangka komoditas di Indonesia diawasi Bappebti. Leverage membuat keuntungan dan kerugian berlipat, sehingga tidak cocok untuk pemula.',
     warn:'Banyak penawaran "trading forex dan komoditas" berkedok investasi menjanjikan profit tetap. Cek izin pialang di situs Bappebti.'}
   ]}
  ]},

 {id:'syariah', title:'Keuangan Syariah', cat:'opsional', img:'t_syariah',
  desc:'Prinsip keuangan syariah, akad-akad yang sering dipakai di bank dan investasi syariah, serta produk syariah yang tersedia di Indonesia.',
  src:'OJK, Buku Seri Literasi Keuangan Perbankan Syariah dan Pasar Modal Syariah · Dewan Syariah Nasional MUI, Fatwa DSN-MUI · Bank Indonesia, Ekonomi dan Keuangan Syariah · IDX, Indeks Saham Syariah · AAOIFI, Shari\'ah Standards',
  sets:[
   {name:'Prinsip Dasar', cards:[
    {q:'Apa <b>prinsip utama</b> keuangan syariah?', a:'Keuangan syariah mengikuti prinsip Islam yang ditetapkan melalui fatwa Dewan Syariah Nasional MUI dan diawasi Dewan Pengawas Syariah di setiap lembaga. Tiga larangan utama yang paling sering disebut:',
     pts:['Riba: tambahan yang disyaratkan atas pinjaman (bunga).','Gharar: ketidakjelasan berlebihan dalam akad, misalnya objek atau harga tidak jelas.','Maysir: spekulasi yang menyerupai perjudian.','Selain itu, dana tidak boleh disalurkan ke usaha yang haram, seperti minuman keras dan perjudian.']},
    {q:'Apa beda <b>bunga</b> dan <b>bagi hasil</b>?', a:'Bunga ditetapkan sebagai persentase tetap dari pokok tanpa melihat hasil usaha. Bagi hasil (nisbah) ditetapkan sebagai proporsi pembagian keuntungan, misalnya 40:60, sehingga nominalnya mengikuti hasil usaha yang sebenarnya.',
     ex:'Deposito mudharabah nisbah nasabah 40%. Jika pendapatan yang dibagihasilkan dari dana nasabah bulan ini setara 8% per tahun, nasabah memperoleh setara 3,2% per tahun. Bulan berikutnya bisa berbeda.'}
   ]},
   {name:'Akad-Akad Utama', cards:[
    {q:'Apa saja <b>akad</b> yang sering ditemui?', a:'Akad adalah perjanjian yang menentukan hak dan kewajiban. Produk syariah dibedakan berdasarkan akadnya.',
     pts:['Wadiah: titipan, misalnya tabungan wadiah. Bank boleh memberi bonus tanpa diperjanjikan.','Mudharabah: kerja sama usaha, satu pihak memberi modal dan pihak lain mengelola, keuntungan dibagi sesuai nisbah.','Musyarakah: kerja sama modal dari kedua pihak, keuntungan dan risiko dibagi.','Murabahah: jual beli dengan margin yang disepakati di awal, sering dipakai untuk pembiayaan rumah dan kendaraan.','Ijarah: sewa atas manfaat barang atau jasa.','Qardh: pinjaman kebajikan tanpa imbalan.']},
    {q:'Bagaimana <b>KPR syariah</b> murabahah bekerja?', a:'Bank membeli rumah lalu menjualnya kepada nasabah dengan harga pokok ditambah margin yang disepakati. Nasabah mencicil harga jual tersebut. Karena harga jual sudah disepakati di awal, cicilan tetap sampai lunas.',
     ex:'Harga rumah Rp500 juta, uang muka Rp100 juta, margin disepakati Rp180 juta untuk 15 tahun. Total yang dicicil Rp580 juta atau sekitar Rp3,22 juta per bulan, tetap selama tenor.',
     tip:'Bandingkan total yang dibayar dengan KPR konvensional, karena cicilan tetap juga berarti tidak ikut turun saat suku bunga pasar turun.'}
   ]},
   {name:'Produk Syariah', cards:[
    {q:'Produk apa saja yang tersedia di <b>pasar modal syariah</b>?', a:'Pasar modal Indonesia memiliki ekosistem syariah yang lengkap.',
     pts:['Saham syariah: masuk Daftar Efek Syariah (DES) OJK, dengan kriteria antara lain utang berbasis bunga maksimal 45% dari total aset dan pendapatan non-halal maksimal 10% dari total pendapatan.','Indeks: ISSI (seluruh saham syariah) dan JII (30 saham syariah paling likuid).','Sukuk: surat berharga syariah, termasuk Sukuk Ritel dan Sukuk Tabungan dari pemerintah.','Reksa dana syariah: dikelola sesuai prinsip syariah dengan pengawasan DPS.']},
    {q:'Apakah simpanan di <b>bank syariah</b> dijamin LPS?', a:'Ya. Simpanan di bank syariah dijamin LPS hingga Rp2 miliar per nasabah per bank, dengan tingkat imbalan penjaminan yang ditetapkan tersendiri. Prinsip 3T tetap berlaku.'}
   ]}
  ]},

 {id:'kripto', title:'Aset Kripto', cat:'opsional', img:'t_kripto',
  desc:'Memahami aset kripto secara jernih: cara kerja, status hukum dan pengawasan di Indonesia, risiko yang perlu diketahui, serta cara menghindari penipuan.',
  src:'OJK, POJK 27/2024 tentang Penyelenggaraan Perdagangan Aset Keuangan Digital termasuk Aset Kripto · OJK, Peralihan Pengawasan Aset Kripto dari Bappebti · Bank Indonesia, kripto bukan alat pembayaran sah · BIS Annual Economic Report, Cryptocurrencies · Investopedia, Cryptocurrency',
  sets:[
   {name:'Mengenal Kripto', cards:[
    {q:'Apa itu <b>aset kripto</b> dan <b>blockchain</b>?', a:'Aset kripto adalah aset digital yang memakai kriptografi dan dicatat di blockchain, yaitu buku besar digital yang disimpan bersama oleh banyak komputer sehingga sulit diubah. Contoh yang terkenal adalah Bitcoin dan Ethereum. Nilainya ditentukan oleh penawaran dan permintaan, tanpa aset dasar atau arus kas seperti saham dan obligasi.',
     pts:['Stablecoin: kripto yang dirancang nilainya mengikuti mata uang tertentu, misalnya dolar AS.','Token: aset yang diterbitkan di atas blockchain lain.']},
    {q:'Bagaimana <b>status kripto</b> di Indonesia?', a:'Aset kripto diperlakukan sebagai aset yang dapat diperdagangkan, bukan alat pembayaran. Bank Indonesia menegaskan alat pembayaran yang sah di Indonesia adalah rupiah. Sejak 10 Januari 2025, pengaturan dan pengawasan perdagangan aset kripto beralih dari Bappebti ke OJK, dengan dasar POJK 27/2024.',

   ]},
   {name:'Risiko', cards:[

     pts:['Volatilitas: harga bisa naik atau turun puluhan persen dalam hitungan hari.','Tidak ada nilai dasar: tidak ada laba atau kupon yang menopang harga.','Risiko platform: bursa atau aplikasi bisa bangkrut, diretas, atau menyalahgunakan dana nasabah.','Risiko kehilangan akses: private key atau frasa pemulihan yang hilang berarti aset hilang permanen.','Risiko proyek: banyak token gagal atau ditinggalkan pengembangnya (rug pull).'],
     ex:'Bitcoin pernah turun lebih dari 70% dari puncaknya di akhir 2021 hingga akhir 2022.'},
    {q:'Bagaimana jika tetap ingin <b>mencoba</b>?', a:'Jika ingin terpapar kripto, perlakukan sebagai bagian kecil portofolio dengan dana yang siap hilang seluruhnya.',

   ]},

/* ================= API =================
   Dua mode dengan fungsi yang sama persis:
   1. REMOTE  : memanggil fungsi RPC Supabase (dipakai saat config.js terisi)
   2. DEMO    : database tiruan di localStorage browser (untuk pratinjau tanpa server)
*/
var API = (function(){
  'use strict';
  var CFG = window.CELENGAN_CONFIG || {};
  var REMOTE = !!(CFG.supabaseUrl && CFG.supabaseAnonKey);

  function err(code, data){ var e = new Error(code); e.code = code; e.data = data || {}; return e; }

  /* ---------- REMOTE: Supabase RPC lewat fetch biasa (tanpa library) ---------- */
  function rpc(fn, args){
    var base = String(CFG.supabaseUrl).replace(/\/+$/,''), key = CFG.supabaseAnonKey;
    var h = {'apikey':key, 'Content-Type':'application/json', 'Accept':'application/json'};
    if(/^eyJ/.test(key)) h.Authorization = 'Bearer ' + key; // anon key lama (JWT); publishable key cukup lewat header apikey
    return fetch(base + '/rest/v1/rpc/' + fn, {
      method:'POST',
      headers:h,
      body: JSON.stringify(args || {})
    }).then(function(r){
      return r.text().then(function(t){
        var j = null; try { j = t ? JSON.parse(t) : null; } catch(x){}
        if(!r.ok){ var m = (j && j.message) || ('HTTP_'+r.status); throw err(/^[A-Z_]+$/.test(m) ? m : 'SERVER', {detail:m}); }
        if(j && j.error) throw err(j.error, j);
        return j;
      });
    }, function(){ throw err('JARINGAN'); });
  }

  var remote = {
    roster: function(){ return rpc('daftar_nama'); },
    config: function(){ return rpc('pengaturan_publik'); },

function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function strip(s){ return String(s).replace(/<[^>]+>/g,''); }
function mmss(s){ s = Math.max(0, Math.round(s||0)); var h = Math.floor(s/3600); var m = Math.floor((s%3600)/60); return (h ? h+':'+('0'+m).slice(-2) : m) + ':' + ('0'+(s%60)).slice(-2); }
var MON = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
function fmtDate(iso, withTime){ if(!iso) return '-'; var d = new Date(iso); if(isNaN(d)) return String(iso);
  var s = d.getDate()+' '+MON[d.getMonth()]+' '+d.getFullYear(); return withTime ? s+', '+('0'+d.getHours()).slice(-2)+'.'+('0'+d.getMinutes()).slice(-2) : s; }
function fmtDay(ymd){ if(!ymd) return '-'; var p = String(ymd).split('-'); return (+p[2])+' '+MON[+p[1]-1]+' '+p[0]; }
function initials(n){ var p = String(n).replace(/[^A-Za-z ]/g,'').split(' ').filter(Boolean); return ((p[0]||'')[0]||'') + ((p[1]||'')[0]||''); }
function greet(){ var h = new Date().getHours(); return h<11?'Selamat pagi,':h<15?'Selamat siang,':h<18?'Selamat sore,':'Selamat malam,'; }

/* periode kuis */
function periodInfo(){
  var c = S.cfg; if(!c.periode_mulai || !c.periode_selesai) return null;
  var m = new Date(c.periode_mulai+'T00:00:00+07:00').getTime(), s = new Date(c.periode_selesai+'T00:00:00+07:00').getTime() + 864e5, now = Date.now();
  return {mulai:c.periode_mulai, selesai:c.periode_selesai, belum: now < m, lewat: now >= s, sisa: Math.max(0, Math.ceil((s-now)/864e5))};
}
function lvInfo(n){
  if(n===3) return {can:false, note:'Belum dirilis. Bank soalnya sedang disiapkan.'};
  if(S.hasil[n]) return {can:false, done:true, note:'Sudah dikumpulkan '+fmtDate(S.hasil[n].submitted_at)+'. Ketuk untuk melihat pembahasan.'};
  if(!S.cfg.buka[n]) return {can:false, note:'Level ini sedang ditutup sementara oleh admin.'};
  var p = periodInfo();
  if(p && p.belum) return {can:false, note:'Periode kuis dimulai '+fmtDay(p.mulai)+'.'};
  if(p && p.lewat) return {can:false, note:'Periode kuis sudah berakhir pada '+fmtDay(p.selesai)+'.'};
  return {can:true, note:'Belum dikerjakan. Ada contoh soal sebelum mulai. Hanya 1 kali kesempatan dan skor langsung final.'};
}

var stack = ['splash'];
function show(id, mode){
  var el = $(id); if(!el) return;
  if(R[id]) el.innerHTML = R[id]();
  Array.prototype.forEach.call(document.querySelectorAll('#phone .screen'), function(s){ s.classList.remove('on'); if(s !== el) s.innerHTML = ''; });
  el.classList.add('on');
  var b = el.querySelector('.body'); if(b) b.scrollTop = 0;
  if(mode === 'replace'){ stack[stack.length-1] = id; }
  else if(mode !== false && stack[stack.length-1] !== id) stack.push(id);
  if(AFTER[id]) AFTER[id]();
  closeSheet();
}

function glossList(){
  var q = S.gq.toLowerCase().trim(), out = '', total = 0;
  vis().concat(TOPICS.filter(function(t){ return vis().indexOf(t)<0; })).forEach(function(t){
    if(S.gcat!=='all' && S.gcat!==t.id) return;
    var l = GLOSS.filter(function(g){ return g[2]===t.id && (!q || (g[0]+' '+g[1]).toLowerCase().indexOf(q)>=0); });
    if(!l.length) return; total += l.length;
    l.sort(function(a,b){ return a[0].localeCompare(b[0]); });
    out += '<div class="gl-head"><b>'+t.title+'</b><span>'+l.length+' istilah</span></div>'+
      l.map(function(g){ return '<button class="gl-item" data-act="gl"><div class="row"><b class="grow">'+g[0]+'</b>'+ic('chev','#6B6A85',16)+'</div><p>'+g[1]+'</p></button>'; }).join('');
  });
  return total ? out : '<div class="empty">Istilah "'+esc(S.gq)+'" belum ada di kamus.</div>';
}

function admStats(){
  var p = ADM.peserta, n = p.length || 1;
  function avg(k){ var l = p.filter(function(x){ return x[k]!=null; }); return l.length ? Math.round(l.reduce(function(a,x){ return a+x[k]; },0)/l.length) : '-'; }
  function part(cat){ var l = p.filter(function(x){ return x.kategori===cat; }); if(!l.length) return 0; return Math.round(100*l.filter(function(x){ return x.l1!=null || x.l2!=null; }).length/l.length); }
  return {l1:p.filter(function(x){ return x.l1!=null; }).length, l2:p.filter(function(x){ return x.l2!=null; }).length,
    both:p.filter(function(x){ return x.l1!=null && x.l2!=null; }).length, avg1:avg('l1'), avg2:avg('l2'),
    part:Math.round(100*p.filter(function(x){ return x.l1!=null || x.l2!=null; }).length/n), org:part('Organik'), non:part('Non-Organik')};
}

  S.user = {nama:p.nama, kategori:p.kategori, pin_default:p.pin_default};
  S.hasil = {1:null, 2:null}; (p.hasil||[]).forEach(function(h){ S.hasil[h.level] = h; });
  loadProg();
}

function startQuizFlow(n){
  busy(true);
  API.mulaiKuis(S.token, n).then(function(d){
    busy(false);
    QZ = {lv:n, items:d.items, i:0, ans:[], picks:[], pick:null, sel:null, sending:false};
    var jw = d.jawaban || {}, resumed = 0;
    Object.keys(jw).forEach(function(k){ QZ.ans[+k] = jw[k]; resumed++; });
    while(QZ.i < QZ.items.length && QZ.ans[QZ.i]) QZ.i++;
    stack = ['beranda','quiz-level'];
    if(QZ.i >= QZ.items.length){ QZ.i = QZ.items.length-1; finishQuiz(); return; }

function exportRows(){

  var lb = [['Peringkat','Nama','Kategori','Skor L1','Skor L2','Kecepatan','Skor Akhir','Selesai']].concat(ADM.leaderboard.map(function(r){

      '<button class="btn btn-sm" style="background:#3A3859;color:#fff" data-act="resetPin" data-arg="'+e+'">Reset PIN ke 1234</button>'+
