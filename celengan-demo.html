<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CELENGAN</title>
<meta name="description" content="CELENGAN: Cerdas Literasi Keuangan KPwBI DIY">
<meta name="theme-color" content="#6C4BF6">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --cream:#FFF7EC; --ink:#1C1B33; --muted:#6B6A85; --line:#EDE7DC; --sand:#F6F0E4;
  --purple:#6C4BF6; --purple-d:#4F32D6; --purple-dd:#3A1FB0; --purple-l:#EFE9FF; --purple-bg:#F5F1FF;
  --green:#047857; --green-d:#03583F; --mint:#34D399; --green-l:#E3F7EF;
  --pink:#D6336C; --pink-d:#A81E51; --pink-l:#FFE9EF; --pink-bg:#FDF2F6;
  --orange:#C2410C; --orange-b:#FF8A3D; --orange-l:#FFEDE0;
  --yellow:#FFC53D; --yellow-l:#FFF3D6; --yellow-t:#8A4B00;
  --stage:#221F3A;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  background:var(--stage); color:var(--ink);
  -webkit-font-smoothing:antialiased; min-height:100dvh;
}
.stage{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.phone{
  position:relative;width:390px;height:844px;max-width:100%;
  background:var(--cream);border-radius:38px;overflow:hidden;
  box-shadow:0 30px 70px rgba(0,0,0,.45);
}
@media (max-width:460px){
  .stage{padding:0}
  .phone{width:100%;height:100dvh;border-radius:0;box-shadow:none}
}

/* ---------- screens ---------- */
.screen{position:absolute;inset:0;display:none;flex-direction:column;background:var(--cream)}
.screen.on{display:flex;animation:in .26s ease}
@keyframes in{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
.body{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.pad{padding:0 22px}
.pb{padding-bottom:26px}

/* ---------- atoms ---------- */
button,.btn{font-family:inherit;border:none;background:none;cursor:pointer;color:inherit}
.btn{display:block;width:100%;text-align:center;padding:17px;border-radius:19px;
  font-family:Inter,system-ui,sans-serif;font-size:17px;font-weight:600;transition:transform .1s}
.btn:active{transform:translateY(2px)}
.btn-p{background:var(--purple);color:#fff;box-shadow:0 5px 0 var(--purple-d)}
.btn-g{background:var(--green);color:#fff;box-shadow:0 5px 0 var(--green-d)}
.btn-y{background:var(--yellow);color:#4A2800;box-shadow:0 5px 0 #D9A200}
.btn-o{background:var(--orange);color:#fff;box-shadow:0 5px 0 #8A2C06}
.btn-ghost{background:#fff;border:1px solid var(--line);color:var(--muted);font-size:16px}
.btn-dark{background:var(--ink);color:#fff}
.btn-sm{padding:14px;font-size:15px;border-radius:17px}
.icon-btn{width:40px;height:40px;border-radius:13px;background:#fff;border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.icon-btn.dk{background:#34324F;border:none}
.icon-btn.gl{background:#fff;border:none}
.row{display:flex;align-items:center;gap:12px}
.col{display:flex;flex-direction:column}
.grow{flex:1;min-width:0}
.sp{flex:1}
h1,h2,h3{margin:0;font-family:Inter,system-ui,sans-serif;font-weight:600}
.label{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.06em}
.muted{color:var(--muted)}
.card{background:#fff;border:1px solid var(--line);border-radius:20px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;
  font-size:11px;font-weight:700;white-space:nowrap}
.bar{height:6px;border-radius:4px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:4px;background:var(--green)}

/* ---------- topbar / progress ---------- */
.topbar{display:flex;align-items:center;gap:12px;padding:22px 22px 0}
.steps{display:flex;gap:6px;flex:1}
.steps>i{flex:1;height:6px;border-radius:3px;background:#E7E0F7}
.steps>i.on{background:var(--purple)}

/* ---------- splash ---------- */
#splash{background:var(--purple);justify-content:center;align-items:center;padding:40px 26px;text-align:center}
#splash .blob{position:absolute;border-radius:50%}
.hero-img{border-radius:26px;overflow:hidden;box-shadow:0 16px 36px rgba(0,0,0,.28)}
.hero-img img{display:block;width:100%;height:100%;object-fit:cover}

/* ---------- lists ---------- */
.pick{display:flex;align-items:center;gap:15px;padding:18px;border-radius:22px;background:#fff;
  border:2px solid var(--purple);box-shadow:0 5px 0 var(--purple);text-align:left;width:100%}
.pick.o{border-color:var(--orange);box-shadow:0 5px 0 var(--orange)}
.sq{width:52px;height:52px;border-radius:17px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.avatar{border-radius:15px;display:flex;align-items:center;justify-content:center;
  font-family:Inter,system-ui,sans-serif;font-weight:600;flex:0 0 auto}
.name-row{display:flex;align-items:center;gap:13px;padding:13px 15px;border-radius:18px;
  background:#fff;border:1px solid var(--line);width:100%;text-align:left}
.name-row.sel{border:2px solid var(--purple)}
.field{display:flex;align-items:center;gap:10px;padding:0 15px;height:52px;border-radius:17px;
  background:#fff;border:1px solid var(--line)}
.field input{flex:1;min-width:0;border:none;outline:none;background:none;font-family:inherit;font-size:15px;color:var(--ink)}

/* ---------- pin ---------- */
.dots{display:flex;justify-content:center;gap:16px}
.dots>i{width:17px;height:17px;border-radius:50%;background:#fff;border:2px solid #D9CFBF;transition:.15s}
.dots>i.f{background:var(--purple);border-color:var(--purple);transform:scale(1.1)}
.keys{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px}
.keys button{height:60px;border-radius:19px;background:#fff;border:1px solid var(--line);
  font-family:Inter,system-ui,sans-serif;font-size:24px;font-weight:500}
.keys button:active{background:var(--purple-l)}
.keys .fn{background:#F2EBDD;border:none;display:flex;align-items:center;justify-content:center}

/* ---------- beranda ---------- */
.head-p{background:var(--purple);border-radius:0 0 26px 26px;padding:22px 22px 20px;color:#fff}
.head-dk{background:var(--ink);border-radius:0 0 26px 26px;padding:20px 22px;color:#fff}
.menu-card{display:flex;align-items:center;gap:15px;padding:18px;border-radius:22px;width:100%;text-align:left}
.tabbar{display:flex;gap:8px;padding:10px 22px calc(18px + env(safe-area-inset-bottom));
  background:#fff;border-top:1px solid var(--line)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:7px 0;
  font-size:11px;font-weight:700;color:var(--muted)}
.tab.on{color:var(--purple)}

/* ---------- topik grid ---------- */
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.fchip{padding:8px 14px;border-radius:999px;background:#fff;border:1px solid var(--line);
  font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap}
.fchip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.tgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.topic{background:#fff;border:1px solid var(--line);border-radius:19px;overflow:hidden;text-align:left;width:100%}
.topic.cur{border:2px solid var(--purple)}
.topic .th{position:relative;aspect-ratio:16/10;background:var(--sand)}
.topic .th img{width:100%;height:100%;object-fit:cover;display:block}
.topic .th .chip{position:absolute;top:7px;left:7px;padding:4px 9px;font-size:9px;
  backdrop-filter:blur(4px)}
.topic .tx{padding:11px 12px 13px}
.topic h3{font-family:Inter,sans-serif;font-size:12.5px;font-weight:700;line-height:1.35;
  min-height:34px}

/* ---------- materi ---------- */
.set-row{display:flex;align-items:center;gap:13px;padding:13px 14px;border-radius:18px;
  background:#fff;border:1px solid var(--line);width:100%;text-align:left}
.set-row.cur{border:2px solid var(--purple);box-shadow:0 4px 0 var(--purple)}

/* ---------- flashcard ---------- */
#kartu{background:var(--purple-l)}
.flip{perspective:1400px;width:100%;flex:1;min-height:0;display:flex;align-items:center}
.flip-in{position:relative;width:100%;height:430px;transform-style:preserve-3d;
  transition:transform .55s cubic-bezier(.4,.2,.2,1)}
.flip.done .flip-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:26px;overflow:hidden;
  box-shadow:0 14px 30px rgba(79,50,214,.2)}
.face.front{background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:20px;padding:28px 24px;text-align:center}
.face.back{background:var(--ink);transform:rotateY(180deg);color:#fff;padding:20px;overflow-y:auto}
.note{padding:14px;border-radius:14px;background:#2B2A48}

/* ---------- quiz ---------- */
#quiz-l1{background:var(--pink-bg)}
#quiz-l2{background:var(--purple-bg)}
.basket{flex:1;padding:14px 8px;border-radius:19px;background:#fff;border:2px dashed var(--green);
  display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;
  font-size:11.5px;font-weight:700;color:var(--green);line-height:1.35}
.basket.p{border-color:var(--purple);color:var(--purple-d)}
.basket.o{border-color:var(--orange);color:var(--orange)}
.basket:active{transform:scale(.97)}
.opt{display:flex;align-items:flex-start;gap:12px;padding:14px 15px;border-radius:17px;background:#fff;
  border:1px solid #DBD0FF;width:100%;text-align:left;font-size:13px;line-height:1.6}
.opt .k{width:26px;height:26px;border-radius:9px;background:var(--purple-l);color:var(--purple-d);
  display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex:0 0 auto}
.opt.sel{border:2px solid var(--purple);box-shadow:0 4px 0 var(--purple)}
.opt.sel .k{background:var(--purple);color:#fff}
.opt.ok{border:2px solid var(--green);background:var(--green-l)}
.opt.ok .k{background:var(--green);color:#fff}
.opt.no{border:2px solid var(--orange);background:var(--orange-l)}
.opt.no .k{background:var(--orange);color:#fff}
.dotrow{display:flex;gap:4px;justify-content:center;flex-wrap:wrap}
.dotrow>i{width:24px;height:5px;border-radius:3px;background:#F0DDE5}
.qnum{width:29px;height:29px;border-radius:10px;display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:700;color:#fff}

/* ---------- result ---------- */
.confetti{position:absolute;border-radius:2px}
.stat{padding:14px 8px;border-radius:17px;text-align:center}
.stat b{display:block;font-family:Inter,system-ui,sans-serif;font-size:23px;font-weight:600}
.stat span{font-size:11px;opacity:.85}

/* ---------- admin ---------- */
#admin{background:#15142A;color:#fff}
.acard{background:#221F3A;border-radius:18px;padding:15px 16px}
.sw{width:46px;height:27px;border-radius:999px;background:#3A3859;position:relative;flex:0 0 auto;transition:.2s}
.sw>i{position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:var(--mint)}
.sw.on>i{left:22px}
.stepper{display:flex;align-items:center;gap:10px;background:#15142A;border-radius:12px;padding:5px}
.stepper button{width:30px;height:30px;border-radius:9px;background:#3A3859;color:#fff;font-size:17px;
  display:flex;align-items:center;justify-content:center}
.stepper b{font-family:Inter,system-ui,sans-serif;font-size:17px;min-width:26px;text-align:center}
.qrow{display:flex;align-items:flex-start;gap:11px;padding:12px 13px;border-radius:14px;background:#221F3A}

/* ---------- screen map ---------- */
.mapbtn{position:fixed;right:18px;bottom:18px;z-index:60;display:flex;align-items:center;gap:8px;
  padding:11px 16px;border-radius:999px;background:#fff;color:var(--ink);
  font-size:13px;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.mapwrap{position:fixed;inset:0;z-index:70;background:rgba(14,13,28,.9);display:none;
  padding:26px 18px;overflow-y:auto}
.mapwrap.on{display:block}
.mapgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;
  max-width:760px;margin:0 auto}
.mapgrid button{padding:13px 14px;border-radius:14px;background:#2B2A48;color:#fff;
  font-size:12.5px;font-weight:600;text-align:left;line-height:1.4}
.mapgrid button:hover{background:var(--purple)}
.maphead{max-width:760px;margin:0 auto 14px;display:flex;align-items:center;gap:12px;color:#fff}

/* ================= V3 additions ================= */
.topic .th{background:#fff;border-bottom:1px solid var(--line)}
.topic .th img{object-fit:contain;padding:8px 10px}
.topic.hide{display:none}
.thumb{background:#fff;border:1px solid var(--line);border-radius:13px;overflow:hidden;flex:0 0 auto;display:block}
.thumb img{width:100%;height:100%;object-fit:contain;display:block;padding:3px}
.tabbar .tab{cursor:pointer}
.tabbar .tab svg{display:block}

/* header with illustration panel */
.mhead{background:var(--purple);border-radius:0 0 26px 26px;padding:20px 22px 18px;flex:0 0 auto}
.mimg{margin-top:14px;height:138px;border-radius:20px;background:#fff;overflow:hidden;display:flex;align-items:center;justify-content:center}
.mimg img{max-width:100%;max-height:100%;object-fit:contain;display:block;padding:8px}
.qhead{position:relative;flex:0 0 auto;border-radius:0 0 26px 26px;padding:20px 22px 18px;background:var(--pink)}
.qhead .qimg{position:absolute;right:16px;bottom:14px;width:132px;height:92px;border-radius:16px;background:#fff;overflow:hidden}
.qhead .qimg img{width:100%;height:100%;object-fit:contain;display:block;padding:4px}

/* menu grid */
.mgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.mini{display:flex;flex-direction:column;align-items:flex-start;gap:9px;padding:14px;border-radius:19px;background:#fff;border:1px solid var(--line);text-align:left;width:100%}
.mini b{font-size:13px}
.mini span.s{font-size:11px;color:var(--muted);line-height:1.4}
.ico{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}

/* daily card */
.daily{display:flex;align-items:center;gap:13px;padding:15px 16px;border-radius:20px;background:var(--yellow);box-shadow:0 5px 0 #D9A200;text-align:left;width:100%;color:#4A2800}
.daily.done{background:var(--yellow-l);box-shadow:none;border:1px dashed #E8C66B}

/* modal sheet + toast */
.modal{position:absolute;inset:0;z-index:30;background:rgba(20,18,40,.55);display:none;align-items:flex-end}
.modal.on{display:flex;animation:fade .2s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{background:#fff;width:100%;border-radius:26px 26px 0 0;padding:10px 22px calc(24px + env(safe-area-inset-bottom));max-height:88%;overflow-y:auto;animation:up .25s ease}
.sheet.dk{background:#221F3A;color:#fff}
@keyframes up{from{transform:translateY(40px)}to{transform:none}}
.grab{width:42px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 14px}
.sheet.dk .grab{background:#3A3859}
.toast{position:absolute;left:16px;right:16px;bottom:96px;z-index:40;display:flex;align-items:center;gap:10px;
  padding:13px 15px;border-radius:15px;background:var(--ink);color:#fff;font-size:12.5px;line-height:1.5;
  box-shadow:0 12px 30px rgba(0,0,0,.3);opacity:0;transform:translateY(10px);transition:.22s;pointer-events:none}
.toast.on{opacity:1;transform:none;pointer-events:auto}
.toast button{margin-left:auto;color:var(--yellow);font-weight:700;font-size:12.5px;flex:0 0 auto}

/* forms */
.inp{width:100%;height:50px;border-radius:15px;border:1px solid var(--line);background:#fff;padding:0 15px;
  font-family:inherit;font-size:15px;color:var(--ink);outline:none}
.inp:focus{border-color:var(--purple)}
textarea.inp{height:88px;padding:12px 15px;resize:none;line-height:1.5}
.sheet.dk .inp{background:#15142A;border-color:#3A3859;color:#fff}
.flabel{display:block;font-size:12px;font-weight:700;color:var(--muted);margin:14px 0 7px}
.sheet.dk .flabel{color:#A8A5C4}
.seg{display:flex;gap:6px;padding:4px;border-radius:14px;background:var(--sand)}
.seg button{flex:1;padding:10px 6px;border-radius:11px;font-size:12.5px;font-weight:700;color:var(--muted)}
.seg button.on{background:#fff;color:var(--purple-d);box-shadow:0 2px 6px rgba(0,0,0,.08)}
.sheet.dk .seg{background:#15142A}
.sheet.dk .seg button.on{background:var(--purple);color:#fff}
input[type=range]{width:100%;accent-color:var(--purple)}
.money{position:relative}
.money span{position:absolute;left:15px;top:50%;transform:translateY(-50%);font-weight:700;color:var(--muted);font-size:14px}
.money .inp{padding-left:42px}
.result{padding:18px;border-radius:20px;background:var(--ink);color:#fff}
.result .big{font-family:Inter,system-ui,sans-serif;font-size:30px;font-weight:600;line-height:1.1}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;padding:8px 0;border-bottom:1px dashed #3A3859}
.kv:last-child{border-bottom:none}
.kv span{color:#A8A5C4}
.chk{display:flex;align-items:flex-start;gap:12px;padding:13px 14px;border-radius:16px;background:#fff;border:1px solid var(--line);width:100%;text-align:left;font-size:12.5px;line-height:1.55}
.chk .bx{width:22px;height:22px;border-radius:7px;border:2px solid #D9CFBF;flex:0 0 auto;display:flex;align-items:center;justify-content:center}
.chk.on{border-color:var(--orange);background:var(--orange-l)}
.chk.on .bx{background:var(--orange);border-color:var(--orange)}
.gauge{height:12px;border-radius:6px;background:linear-gradient(90deg,var(--mint) 0 50%,var(--yellow) 50% 66.7%,#FF7B5C 66.7% 100%);position:relative}
.gauge i{position:absolute;top:-5px;width:4px;height:22px;border-radius:2px;background:#fff;box-shadow:0 0 0 2px var(--ink);transition:left .3s}
.bars{display:flex;align-items:flex-end;gap:6px;height:110px;margin-top:14px}
.bars>div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%;gap:4px;align-items:center}
.bars i{display:block;width:100%;border-radius:6px 6px 3px 3px;background:var(--purple);position:relative;overflow:hidden}
.bars i b{position:absolute;left:0;right:0;bottom:0;background:var(--mint)}
.bars span{font-size:9.5px;color:#A8A5C4}

/* glossary */
.gl-item{background:#fff;border:1px solid var(--line);border-radius:16px;padding:13px 15px;width:100%;text-align:left}
.gl-item b{font-size:13.5px}
.gl-item p{margin:6px 0 0;font-size:12.5px;color:var(--muted);line-height:1.6;display:none}
.gl-item.on{border-color:var(--purple)}
.gl-item.on p{display:block}


/* misc */
.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:none}20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.err{color:var(--orange);font-size:12.5px;font-weight:600;text-align:center;min-height:18px;margin-top:10px}
.empty{padding:26px 18px;border-radius:18px;border:1px dashed #D9CFBF;background:var(--sand);text-align:center;font-size:12.5px;color:var(--muted);line-height:1.6}
.bm{width:40px;height:40px;border-radius:13px;background:#fff;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.cardimg{width:156px;height:98px;border-radius:18px;overflow:hidden;background:var(--purple-bg)}
.cardimg img{width:100%;height:100%;object-fit:contain;display:block;padding:6px}
.qtile{padding:14px;border-radius:16px;background:#fff;border:1px solid var(--line)}
.opt:disabled{cursor:default}
.adm-row{display:flex;align-items:center;gap:11px;padding:12px 13px;border-radius:14px;background:#221F3A}
.mapgrid button.reset{background:var(--orange);grid-column:1/-1;text-align:center}
.rowbtn{display:flex;align-items:center;gap:12px;padding:14px 15px;border-radius:17px;background:#fff;border:1px solid var(--line);width:100%;text-align:left}

.qhead{min-height:150px}
.gauge-lbl{position:relative;height:14px}
.topic{display:block}
.topic .th{display:block;aspect-ratio:16/10;overflow:hidden}
.topic .tx{display:block}
.topic .th img{height:100%}
@media (max-width:460px){
  .mapbtn{left:0;right:auto;top:44%;bottom:auto;padding:12px 5px;gap:6px;border-radius:0 12px 12px 0;writing-mode:vertical-rl;font-size:10.5px;opacity:.9;box-shadow:0 4px 14px rgba(0,0,0,.25)}
  .mapbtn svg{width:13px;height:13px}
}

/* V4: Inter typography */
h1,h2,h3{font-weight:700;letter-spacing:-.015em}

/* V5: dropdown pencarian nama */
.ddwrap{position:relative}
.dd{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:5;background:#fff;border:1px solid var(--line);border-radius:16px;
  box-shadow:0 14px 30px rgba(28,27,51,.14);overflow:hidden;max-height:320px;overflow-y:auto}
.dd-item{display:flex;align-items:center;gap:11px;width:100%;padding:10px 13px;text-align:left;font-size:14px;color:var(--ink);border-bottom:1px solid var(--line)}
.dd-item:last-child{border-bottom:none}
.dd-item:hover,.dd-item:focus-visible{background:var(--purple-bg);outline:none}
.dd-item b{color:var(--purple-d)}
.dd-empty,.dd-more{padding:13px 15px;font-size:12px;color:var(--muted);line-height:1.5}
.dd-more{background:var(--sand);border-top:1px solid var(--line)}

/* V6: kotak segera hadir */
.mini.soon{background:var(--sand);border-style:dashed;cursor:not-allowed;opacity:.72;filter:grayscale(.6)}
.mini.soon b{color:var(--muted)}
.soon-tag{font-size:9px;font-weight:800;letter-spacing:.06em;color:var(--muted);background:#fff;border:1px solid var(--line);border-radius:999px;padding:4px 8px;white-space:nowrap}
/* ===== v7: versi deploy ===== */
.busy{position:absolute;inset:0;z-index:60;display:none;align-items:center;justify-content:center;background:rgba(255,247,236,.55)}
.busy.on{display:flex}
.busy i{width:38px;height:38px;border-radius:50%;border:4px solid var(--purple-l);border-top-color:var(--purple);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
button:disabled{opacity:.55}
.demo-chip{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;background:rgba(255,197,61,.22);color:#FFE6A8;font-size:10.5px;font-weight:700;letter-spacing:.04em}

/* belajar: pilihan cara belajar */
.mode{display:flex;align-items:center;gap:13px;width:100%;text-align:left;padding:14px 15px;border-radius:19px;background:#fff;border:1px solid var(--line);box-shadow:0 3px 0 var(--line)}
.mode .mi{width:46px;height:46px;border-radius:15px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.mode b{display:block;font-size:14.5px}
.mode .s{display:block;margin-top:2px;font-size:11.5px;color:var(--muted);line-height:1.45}
.mode .t{font-size:11px;font-weight:700;color:var(--muted);white-space:nowrap}
.mode.done{border-color:#BFE8D7;box-shadow:0 3px 0 #BFE8D7}
.tick{width:22px;height:22px;border-radius:50%;background:var(--green);display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto}
.tmode{display:flex;gap:4px;margin-top:7px}
.tmode i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.tmode i.on{background:var(--green)}

/* mode baca */
.read h2{font-size:17px;margin-top:22px;padding-top:16px;border-top:1px solid var(--line)}
.read h3{font-size:14.5px;margin-top:16px}
.read p{margin:6px 0 0;font-size:13.5px;line-height:1.7;color:#35344F}
.read .fx{margin-top:10px;padding:11px 14px;border-radius:14px;background:var(--ink);color:var(--yellow);font-size:13.5px;font-weight:600;line-height:1.5}
.read .fx small,.read .ex small{display:block;font-size:10px;font-weight:700;letter-spacing:.06em;color:#A8A5C4;margin-bottom:4px}
.read .ex{margin-top:10px;padding:11px 14px;border-radius:14px;background:var(--yellow-l);font-size:13px;line-height:1.6;color:#4A2800}
.read .ex small{color:var(--yellow-t)}
.keybox{margin-top:22px;padding:16px;border-radius:19px;background:var(--green-l);border:1px solid #BFE8D7}
.keybox ul{margin:10px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:9px}
.keybox li{display:flex;gap:10px;font-size:13.5px;line-height:1.55;color:#03583F}
.keybox li b{width:22px;height:22px;border-radius:7px;background:var(--green);color:#fff;font-size:11.5px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;margin-top:1px}

/* mitos atau fakta */
.mtop{display:flex;align-items:center;gap:12px;padding:22px 22px 0;flex:0 0 auto}
.deck{position:relative;flex:1;margin:16px 22px 0;min-height:290px}
.mcard{position:absolute;inset:0;border-radius:26px;background:#fff;box-shadow:0 14px 34px rgba(168,30,81,.16);display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:26px 24px;text-align:center;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
.mcard.back2{transform:translateY(14px) scale(.94);opacity:.6;box-shadow:none}
.mcard .q{font-size:21px;font-weight:700;line-height:1.4;letter-spacing:-.01em}
.stamp{position:absolute;top:22px;padding:6px 12px;border-radius:10px;border:3px solid;font-weight:800;font-size:16px;letter-spacing:.05em;opacity:0;transform:rotate(-10deg)}
.stamp.m{right:20px;color:var(--orange);border-color:var(--orange)}
.stamp.f{left:20px;color:var(--green);border-color:var(--green);transform:rotate(10deg)}
.mbtns{display:flex;gap:12px;padding:18px 22px 6px;flex:0 0 auto}
.mbtn{flex:1;padding:15px;border-radius:18px;font-size:16px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:8px}
.mbtn.m{background:var(--orange-l);color:var(--orange);box-shadow:0 4px 0 #F2C4A6}
.mbtn.f{background:var(--green-l);color:var(--green);box-shadow:0 4px 0 #B8E6D3}
.swipehint{text-align:center;font-size:12px;color:var(--muted);padding:6px 22px 20px;flex:0 0 auto}
.fb{position:absolute;inset:0;border-radius:26px;display:flex;flex-direction:column;padding:26px 24px;color:#fff;animation:pop .25s ease}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:none;opacity:1}}
.fb .v{font-size:13px;font-weight:800;letter-spacing:.06em;opacity:.9}
.fb h2{font-size:28px;margin-top:6px;color:#fff}
.fb p{font-size:15.5px;line-height:1.55;margin:14px 0 0}
.fb .btn{margin-top:auto}

/* kamu pilih apa */
.chat{margin:14px 22px 0;border-radius:22px;background:#E9E3D6;padding:14px;display:flex;flex-direction:column;gap:8px}
.chathead{display:flex;align-items:center;gap:10px;padding:2px 2px 8px;border-bottom:1px solid rgba(0,0,0,.06)}
.chathead .av{width:34px;height:34px;border-radius:50%;background:var(--pink);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;flex:0 0 auto}
.bub{align-self:flex-start;max-width:86%;background:#fff;border-radius:4px 16px 16px 16px;padding:10px 12px;font-size:14px;line-height:1.45;box-shadow:0 1px 1px rgba(0,0,0,.06)}
.bub small{display:block;text-align:right;font-size:10px;color:var(--muted);margin-top:3px}
.copt{display:flex;align-items:center;gap:12px;padding:15px;border-radius:18px;background:#fff;border:2px solid #DBD0FF;text-align:left;font-size:14px;font-weight:600;line-height:1.45;width:100%}
.copt .k{width:30px;height:30px;border-radius:10px;background:var(--purple-l);color:var(--purple-d);display:flex;align-items:center;justify-content:center;font-weight:800;flex:0 0 auto}
.cres{margin-top:12px;border-radius:20px;padding:17px;color:#fff;animation:pop .25s ease}
.cres .v{font-size:11.5px;font-weight:800;letter-spacing:.06em;opacity:.9}
.cres h3{font-size:19px;margin-top:4px}
.cres p{font-size:14px;line-height:1.55;margin:8px 0 0}

/* layar selesai modul */
.take{display:flex;gap:12px;align-items:flex-start;padding:13px 14px;border-radius:16px;background:var(--green-d);font-size:13.5px;line-height:1.5;color:#fff}
.take b.n{width:24px;height:24px;border-radius:8px;background:var(--mint);color:#04372A;display:flex;align-items:center;justify-content:center;font-size:12px;flex:0 0 auto;margin-top:1px}

/* kamus */
.gl-head{margin-top:18px;display:flex;align-items:center;gap:10px}
.gl-head:first-child{margin-top:4px}
.gl-head b{font-size:12px;font-weight:700;letter-spacing:.05em;color:var(--muted);text-transform:uppercase}
.gl-head span{font-size:11px;color:var(--muted)}

/* saran */
.saran-card{margin-top:20px;padding:16px;border-radius:20px;background:#fff;border:1px dashed #CFC3FF;display:flex;align-items:center;gap:13px}
.stars{display:flex;gap:8px;margin-top:4px}
.stars button{width:44px;height:44px;border-radius:14px;background:var(--sand);display:flex;align-items:center;justify-content:center}
.stars button.on{background:var(--yellow-l)}

/* kuis */
.qhead .back-on-head{position:relative;z-index:2;margin-bottom:12px;background:rgba(255,255,255,.2);border:none}
.period{margin-top:14px;padding:13px 15px;border-radius:17px;background:var(--yellow-l);display:flex;gap:10px;align-items:flex-start;font-size:12px;line-height:1.55;color:#4A2800}
.warnbox{margin-top:14px;padding:12px 14px;border-radius:15px;background:var(--orange-l);color:#7A2A05;font-size:12px;line-height:1.6;display:flex;gap:9px;align-items:flex-start}

/* admin */
.dinp{width:100%;height:46px;border-radius:13px;border:1px solid #3A3859;background:#15142A;color:#fff;padding:0 12px;font-family:inherit;font-size:14px;color-scheme:dark}
.tabs2{display:flex;gap:6px;padding:4px;border-radius:14px;background:#15142A}
.tabs2 button{flex:1;padding:10px 6px;border-radius:11px;font-size:12.5px;font-weight:700;color:#A8A5C4}
.tabs2 button.on{background:var(--purple);color:#fff}
.lv-chip{display:inline-flex;align-items:center;padding:3px 8px;border-radius:8px;font-size:10px;font-weight:700}
.sheet.dk textarea.inp{height:76px}
.sheet .cols2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mini-wide{display:flex;align-items:center;gap:12px;margin-top:10px;padding:13px 14px;border-radius:19px;background:var(--sand);border:1px dashed #D9CFBF;opacity:.75;filter:grayscale(.6);cursor:not-allowed}

/* v8: tipe soal Level 1 */
.qcard{margin-top:14px;padding:20px 18px;border-radius:22px;background:var(--ink);color:#fff;box-shadow:0 12px 24px rgba(79,50,214,.18);position:relative}
.qcard p{margin:0;font-size:16.5px;font-weight:600;line-height:1.5}
.qcard .qmark{width:40px;height:40px;border-radius:13px;background:#fff;display:flex;align-items:center;justify-content:center;margin-bottom:12px}
.qcard.bs{background:#fff;color:var(--ink);border:2px solid #BFE8D7;box-shadow:0 6px 0 #BFE8D7}
.qcard.bs .qmark{background:var(--green-l)}
.qcard.calc{background:#2A1F05;background:linear-gradient(160deg,#3A2A06,#1C1B33)}
.qcard.calc .qmark{background:var(--yellow)}
.bsbtn{flex:1;padding:20px 10px;border-radius:20px;color:#fff;font-size:17px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:8px;letter-spacing:.03em}
.bsbtn.b{background:var(--green);box-shadow:0 5px 0 var(--green-d)}
.bsbtn.s{background:var(--orange);box-shadow:0 5px 0 #8A2C06}
.bsbtn:active{transform:translateY(2px)}
.numgrid{display:grid;grid-template-columns:1fr 1fr}
.opt.num{flex-direction:column;align-items:flex-start;gap:6px;font-size:16px;font-weight:700;font-family:Inter,sans-serif}
.opt.num .k{width:22px;height:22px;font-size:11px}

/* v9: mode baca lebih kaya */
.read .rpts{margin:10px 0 0;padding:0 0 0 2px;list-style:none;display:flex;flex-direction:column;gap:7px}
.read .rpts li{position:relative;padding-left:18px;font-size:13.5px;line-height:1.6;color:#35344F}
.read .rpts li:before{content:'';position:absolute;left:3px;top:8px;width:7px;height:7px;border-radius:50%;background:var(--purple)}
.read .rtip{margin-top:10px;padding:11px 14px;border-radius:14px;background:var(--green-l);font-size:13px;line-height:1.6;color:#03583F}
.read .rwarn{margin-top:10px;padding:11px 14px;border-radius:14px;background:var(--orange-l);font-size:13px;line-height:1.6;color:#7A2A05}
.read .rtip small,.read .rwarn small{display:block;font-size:10px;font-weight:700;letter-spacing:.06em;margin-bottom:4px;opacity:.8}
.toc{margin-top:14px;padding:14px 15px;border-radius:17px;background:#fff;border:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.toc-i{display:flex;gap:10px;align-items:center;font-size:13px;font-weight:600}
.toc-i b{width:22px;height:22px;border-radius:7px;background:var(--purple-l);color:var(--purple-d);display:flex;align-items:center;justify-content:center;font-size:11px;flex:0 0 auto}
.toc-i i{font-style:normal;font-weight:500;color:var(--muted);font-size:11.5px}

</style>
</head>

TOPICS.push(
 {id:'dasar', title:'Keuangan Dasar', cat:'wajib', img:'t_dasar',
  desc:'Pondasi semua keputusan keuangan: membaca arus kas, menyusun anggaran, menghitung kekayaan bersih, dan memeriksa kesehatan keuangan secara berkala.',
  src:'OJK, Buku Seri Literasi Keuangan Jilid 1 (sikapiuangmu.ojk.go.id) · Bank Indonesia, Edukasi Keuangan · CFP Board, Financial Planning Competency Handbook · Consumer Financial Protection Bureau (CFPB), Your Money Your Goals',
  sets:[
   {name:'Arus Kas & Anggaran', cards:[
    {q:'Apa itu <b>arus kas pribadi</b> dan kenapa penting?', a:'Arus kas adalah selisih uang masuk (gaji, tunjangan, usaha sampingan) dan uang keluar dalam satu periode. Arus kas positif berarti ada sisa untuk ditabung, berinvestasi, atau melunasi utang lebih cepat. Arus kas negatif berarti pengeluaran ditutup dari tabungan atau utang, dan kalau berlangsung lama akan menggerus kondisi keuangan.',
     f:'Arus kas bersih = Total pemasukan − Total pengeluaran',
     ex:'Gaji bersih Rp8 juta, pengeluaran Rp6,5 juta. Arus kas bersih +Rp1,5 juta per bulan atau Rp18 juta per tahun yang bisa diarahkan ke tujuan keuangan.',
     tip:'Hitung arus kas memakai angka bersih yang benar-benar masuk rekening, setelah potongan pajak dan iuran.'},
    {q:'Bagaimana memakai pola anggaran <b>50/30/20</b>?', a:'Penghasilan bersih dibagi tiga: 50% kebutuhan pokok, 30% keinginan, dan 20% tabungan, investasi, atau pelunasan utang. Porsinya fleksibel. Orang yang tinggal di kota dengan biaya hidup tinggi mungkin butuh 60% untuk kebutuhan, sehingga porsi keinginan yang dikurangi. Yang tidak boleh dikorbankan adalah pos tabungan.',
     f:'50% kebutuhan + 30% keinginan + 20% tabungan/investasi/utang',
     ex:'Gaji bersih Rp7 juta: kebutuhan Rp3,5 juta (sewa, makan, transport, listrik), keinginan Rp2,1 juta (nongkrong, langganan streaming, hobi), tabungan Rp1,4 juta.',
     pts:['Kebutuhan: hal yang tetap harus dibayar walau penghasilan turun.','Keinginan: hal yang menambah kenyamanan dan bisa ditunda.','Cicilan konsumtif masuk pos kebutuhan karena wajib dibayar, sehingga makin besar cicilan makin sempit ruang anggaran.']},
    {q:'Apa bedanya anggaran <b>50/30/20</b>, <b>amplop</b>, dan <b>zero-based</b>?', a:'Tiga metode populer dengan gaya berbeda. Pola 50/30/20 cocok untuk pemula karena sederhana. Metode amplop membagi uang ke pos tertentu (fisik atau rekening terpisah) dan berhenti belanja saat amplopnya habis. Zero-based budgeting memberi tugas pada setiap rupiah sampai sisa anggaran nol, cocok untuk orang yang ingin kontrol penuh.',
     pts:['50/30/20: cepat, cukup tiga pos.','Amplop: ampuh menahan belanja impulsif, bisa memakai fitur "kantong" di aplikasi bank.','Zero-based: paling detail, butuh pencatatan rutin.'],
     tip:'Pilih metode yang paling mungkin kamu jalankan selama 3 bulan. Metode terbaik adalah yang konsisten dipakai.'},
    {q:'Kenapa menabung sebaiknya di <b>awal bulan</b>?', a:'Prinsip "pay yourself first": sisihkan tabungan begitu gaji masuk, baru belanjakan sisanya. Menabung dari sisa belanja cenderung gagal karena pengeluaran menyesuaikan saldo yang tersedia. Cara paling efektif adalah autodebet atau transfer terjadwal ke rekening tabungan terpisah di tanggal gajian.',
     ex:'Atur autodebet Rp1 juta setiap tanggal 26 ke rekening tabungan. Dalam setahun terkumpul Rp12 juta tanpa perlu mengandalkan niat setiap bulan.'}
   ]},
   {name:'Kekayaan Bersih & Rasio Kesehatan', cards:[
    {q:'Apa itu <b>kekayaan bersih</b> (net worth)?', a:'Total aset dikurangi total utang. Angka ini lebih menggambarkan kesehatan keuangan dibanding besar gaji, karena gaji besar bisa habis untuk cicilan. Kekayaan bersih bisa negatif, misalnya bagi yang baru lulus dengan utang pendidikan, dan yang penting adalah arahnya naik dari tahun ke tahun.',
     f:'Kekayaan bersih = Total aset − Total utang',
     ex:'Aset: tabungan Rp20 juta, reksa dana Rp15 juta, motor Rp12 juta (nilai jual sekarang). Utang: sisa cicilan motor Rp6 juta, kartu kredit Rp3 juta. Kekayaan bersih = Rp47 juta − Rp9 juta = Rp38 juta.',
     tip:'Nilai aset memakai harga jual hari ini, bukan harga beli. Kendaraan nilainya turun setiap tahun.'},
    {q:'Apa beda <b>aset likuid</b>, <b>aset investasi</b>, dan <b>aset guna</b>?', a:'Aset likuid mudah dicairkan tanpa kehilangan banyak nilai, misalnya tabungan, deposito jangka pendek, dan reksa dana pasar uang. Aset investasi ditujukan untuk tumbuh dalam jangka panjang, misalnya saham, obligasi, dan emas. Aset guna dipakai sehari-hari dan cenderung turun nilainya, misalnya kendaraan, gawai, dan perabot.',
     pts:['Likuid: untuk dana darurat dan kebutuhan jangka pendek.','Investasi: untuk tujuan jangka menengah dan panjang.','Guna: memberi manfaat, tetapi jangan dihitung sebagai sumber dana darurat.']},
    {q:'Rasio apa saja untuk <b>cek kesehatan keuangan</b>?', a:'Perencana keuangan memakai beberapa rasio sederhana sebagai "medical check-up" keuangan. Angka patokan berikut adalah panduan umum, bukan aturan baku.',
     pts:['Rasio tabungan: tabungan ÷ penghasilan, idealnya minimal 10 sampai 20%.','Rasio likuiditas: aset likuid ÷ pengeluaran bulanan, idealnya 3 sampai 6 kali.','Rasio cicilan: total cicilan ÷ penghasilan bersih, idealnya maksimal 30%.','Rasio utang terhadap aset: total utang ÷ total aset, makin kecil makin sehat.'],
     ex:'Penghasilan Rp10 juta, menabung Rp1,5 juta (15%), aset likuid Rp25 juta dengan pengeluaran Rp6 juta (4,2 bulan), cicilan Rp2 juta (20%). Ketiganya masih dalam batas sehat.'},
    {q:'Seberapa sering keuangan perlu <b>dievaluasi</b>?', a:'Catat pengeluaran setiap hari atau minggu, tinjau anggaran setiap bulan, dan hitung ulang kekayaan bersih serta rasio kesehatan minimal setahun sekali. Evaluasi juga perlu setiap ada perubahan besar: menikah, punya anak, pindah kerja, atau mulai mencicil rumah.',
     tip:'Jadwalkan "rapat keuangan" 30 menit di awal setiap bulan. Bandingkan rencana dan realisasi, lalu putuskan satu perbaikan kecil.'}
   ]},
   {name:'Kebiasaan & Bias Perilaku', cards:[
    {q:'Apa itu <b>lifestyle inflation</b>?', a:'Kecenderungan menaikkan gaya hidup setiap kali penghasilan naik, sehingga tabungan tidak ikut bertambah. Kenaikan gaji habis untuk kendaraan baru, tempat nongkrong yang lebih mahal, atau gawai terbaru.',
     ex:'Gaji naik Rp1 juta. Jika separuhnya (Rp500 ribu) langsung dialihkan ke investasi, dalam 10 tahun dengan imbal hasil 6% per tahun terkumpul sekitar Rp82 juta.',
     tip:'Terapkan aturan "naik gaji, naik tabungan": setiap kenaikan penghasilan, minimal separuhnya langsung masuk pos tabungan.'},
    {q:'Bias perilaku apa yang sering <b>menjebak</b> keputusan keuangan?', a:'Ilmu ekonomi perilaku menunjukkan keputusan keuangan sering dipengaruhi emosi dan jalan pintas berpikir. Mengenali bias membantu kita mengambil jeda sebelum memutuskan.',
     pts:['Present bias: lebih menghargai kesenangan sekarang dibanding manfaat masa depan.','Herding: ikut-ikutan karena banyak orang melakukannya, misalnya membeli saham yang sedang viral.','Anchoring: terpaku pada angka pertama, misalnya merasa "murah" karena ada coretan harga diskon.','Loss aversion: rasa sakit rugi terasa dua kali lebih kuat dari senangnya untung, sehingga orang enggan menjual investasi yang jelas buruk.'],
     tip:'Untuk pembelian besar yang tidak mendesak, terapkan aturan tunggu 72 jam.'},
    {q:'Kenapa <b>paylater dan cicilan kecil</b> terasa ringan?', a:'Cicilan kecil memecah harga besar sehingga terasa terjangkau, padahal totalnya tetap sama atau lebih mahal karena bunga dan biaya layanan. Banyak cicilan kecil yang menumpuk bisa membuat rasio cicilan diam-diam melewati batas aman.',
     ex:'Lima cicilan "cuma" Rp300 ribu per bulan berarti Rp1,5 juta. Pada gaji Rp6 juta, itu sudah 25% penghasilan.',
     warn:'Riwayat pembayaran paylater tercatat di SLIK OJK. Telat bayar dapat mempersulit pengajuan KPR atau kredit lain.'}
   ]}
  ]},

 {id:'tujuan', title:'Perencanaan Tujuan Keuangan', cat:'wajib', img:'t_tujuan',

  src:'OJK, Buku Seri Literasi Keuangan Jilid 1 · CFP Board, Financial Planning Process · FINRA Investor Education, Saving and Investing · Investopedia, Time Value of Money',
  sets:[
   {name:'Menetapkan Tujuan', cards:[
    {q:'Apa itu tujuan keuangan <b>SMART</b>?', a:'Tujuan yang Specific (jelas), Measurable (terukur dalam rupiah), Achievable (realistis), Relevant (penting bagimu), dan Time-bound (punya tenggat). "Ingin punya rumah" belum SMART. "Mengumpulkan uang muka rumah Rp100 juta dalam 4 tahun" sudah SMART.',
     ex:'Target Rp100 juta dalam 48 bulan tanpa memperhitungkan imbal hasil berarti menabung sekitar Rp2,1 juta per bulan. Jika angka itu terlalu berat, ubah tenggat atau nilai targetnya.'},
    {q:'Bagaimana mengelompokkan tujuan berdasarkan <b>jangka waktu</b>?', a:'Jangka waktu menentukan instrumen yang cocok. Makin panjang waktunya, makin besar ruang untuk instrumen yang berfluktuasi karena ada waktu untuk pulih.',
     pts:['Jangka pendek (di bawah 1 tahun): liburan, gawai, biaya acara. Tabungan, deposito, reksa dana pasar uang.','Jangka menengah (1 sampai 5 tahun): uang muka rumah, pernikahan. Reksa dana pendapatan tetap, SBN ritel, deposito.','Jangka panjang (di atas 5 tahun): pendidikan anak, pensiun. Reksa dana saham, saham, campuran yang terdiversifikasi.']},
    {q:'Tujuan mana yang <b>didahulukan</b>?', a:'Urutan umum yang dianjurkan perencana keuangan: (1) dana darurat dan proteksi dasar, (2) lunasi utang berbunga tinggi, (3) tujuan wajib seperti pendidikan anak dan pensiun, (4) tujuan gaya hidup. Tujuan bisa berjalan paralel, tetapi pondasi perlu kuat lebih dulu.',
     warn:'Berinvestasi untuk mengejar imbal hasil 10% per tahun sambil membiarkan utang kartu kredit berbunga sekitar 21% per tahun adalah langkah yang merugikan.'}
   ]},
   {name:'Menghitung Target', cards:[
    {q:'Kenapa target harus memperhitungkan <b>inflasi</b>?', a:'Harga barang dan jasa naik setiap tahun. Biaya kuliah, harga rumah, dan biaya kesehatan sering naik lebih cepat dari inflasi umum. Target yang dihitung dengan harga hari ini akan terasa kurang saat waktunya tiba.',
     f:'Nilai masa depan = Biaya hari ini × (1 + inflasi)ⁿ',
     ex:'Biaya kuliah hari ini Rp60 juta, kenaikan biaya pendidikan diasumsikan 8% per tahun, dibutuhkan 15 tahun lagi: 60 × 1,08¹⁵ ≈ Rp190 juta.'},
    {q:'Bagaimana menghitung <b>setoran bulanan</b> yang dibutuhkan?', a:'Setelah tahu nilai target di masa depan, hitung setoran rutin dengan memperhitungkan imbal hasil instrumen. Kalkulator di aplikasi bank atau spreadsheet (fungsi PMT) bisa membantu.',
     f:'Setoran bulanan = Target × r ÷ ((1 + r)ⁿ − 1), dengan r = imbal hasil per bulan dan n = jumlah bulan',
     ex:'Target Rp190 juta dalam 180 bulan dengan imbal hasil 8% per tahun (sekitar 0,64% per bulan): setoran sekitar Rp550 ribu per bulan. Tanpa imbal hasil, butuh Rp1,06 juta per bulan.',
     tip:'Selisih dua angka di atas adalah hasil kerja bunga majemuk. Makin awal mulai, makin ringan setorannya.'},
    {q:'Apa yang dilakukan jika target <b>tidak realistis</b>?', a:'Ada empat tuas yang bisa diatur: tambah setoran, perpanjang waktu, turunkan target, atau pilih instrumen dengan potensi imbal hasil lebih tinggi sesuai profil risiko. Hindari memaksakan instrumen berisiko tinggi untuk tujuan jangka pendek.',
     pts:['Tambah setoran: kurangi pos keinginan atau tambah penghasilan.','Perpanjang waktu: misalnya beli rumah 2 tahun lebih lambat.','Turunkan target: rumah yang lebih kecil atau lokasi alternatif.','Sesuaikan instrumen: hanya bila waktunya cukup panjang.']}
   ]},
   {name:'Tahapan Hidup', cards:[
    {q:'Apa fokus keuangan di setiap <b>tahap hidup</b>?', a:'Kebutuhan berubah seiring usia. Siklus hidup keuangan membantu menentukan prioritas.',
     pts:['Awal karier (20-an): bangun kebiasaan anggaran, dana darurat, hindari utang konsumtif, mulai investasi rutin.','Berkeluarga (30-an): proteksi jiwa dan kesehatan, dana pendidikan anak, uang muka rumah.','Puncak karier (40-an sampai 50-an): percepat dana pensiun, lunasi KPR, evaluasi portofolio.','Menjelang dan masa pensiun: alihkan ke instrumen yang lebih stabil, atur arus kas pensiun.']},
    {q:'Bagaimana menyiapkan <b>dana pendidikan anak</b>?', a:'Hitung biaya per jenjang (SD, SMP, SMA, kuliah) dengan memperhitungkan kenaikan biaya pendidikan, lalu siapkan pos terpisah untuk setiap jenjang. Jenjang terdekat memakai instrumen yang lebih stabil, jenjang yang masih lama bisa memakai reksa dana saham atau campuran.',
     tip:'Asuransi pendidikan bukan satu-satunya cara. Bandingkan biayanya dengan kombinasi asuransi jiwa berjangka plus investasi terpisah.'},
    {q:'Apa itu <b>sinking fund</b>?', a:'Pos tabungan untuk pengeluaran besar yang sudah pasti datang tetapi tidak setiap bulan, misalnya pajak kendaraan, biaya sekolah tahunan, servis besar, atau mudik Lebaran. Dengan menyicil ke pos ini setiap bulan, pengeluaran besar tidak mengganggu anggaran dan dana darurat tetap utuh.',
     ex:'Biaya mudik tahunan Rp6 juta: sisihkan Rp500 ribu per bulan ke rekening "Mudik".'}
   ]}
  ]},

 {id:'nabung', title:'Menabung & Dana Darurat', cat:'wajib', img:'pig',
  desc:'Menyiapkan bantalan untuk kejadian tak terduga, memilih produk simpanan yang tepat, dan memahami penjaminan simpanan oleh LPS.',
  src:'LPS, Ketentuan Penjaminan Simpanan (lps.go.id) · OJK, Buku Seri Literasi Keuangan Perbankan · CFPB, An Essential Guide to Building an Emergency Fund · Investopedia, Emergency Fund',
  sets:[
   {name:'Dana Darurat', cards:[
    {q:'Berapa besar <b>dana darurat</b> yang ideal?', a:'Panduan umum perencana keuangan di Indonesia: 3 bulan pengeluaran untuk lajang, 6 bulan untuk yang sudah menikah, lalu tambah sekitar 1 bulan untuk setiap anak. Pekerja dengan penghasilan tidak tetap (pekerja lepas, pedagang, pegawai kontrak) sebaiknya menyiapkan lebih, misalnya 6 sampai 12 bulan.',
     f:'Dana darurat = Pengeluaran bulanan × jumlah bulan',
     ex:'Pengeluaran Rp5 juta per bulan, menikah dengan 1 anak: (6 + 1) × Rp5 juta = Rp35 juta.',
     tip:'Hitung memakai pengeluaran wajib saja (tanpa pos keinginan), karena saat darurat pengeluaran bisa ditekan.'},
    {q:'Di mana sebaiknya dana darurat <b>disimpan</b>?', a:'Di instrumen yang aman dan cepat dicairkan, dengan nilai stabil. Dana darurat boleh dibagi dua lapis: sebagian di tabungan untuk akses instan, sisanya di instrumen yang sedikit lebih menguntungkan tetapi tetap likuid.',
     pts:['Lapis 1 (sekitar 1 bulan pengeluaran): rekening tabungan terpisah.','Lapis 2: deposito tenor pendek atau reksa dana pasar uang yang biasanya cair 1 sampai 2 hari kerja.','Hindari saham, kripto, dan properti karena nilainya bisa turun tepat saat dibutuhkan.']},
    {q:'Kapan dana darurat <b>boleh dipakai</b>, dan bagaimana mengisinya kembali?', a:'Dipakai untuk kejadian mendesak yang tidak direncanakan: sakit, kehilangan penghasilan, kerusakan rumah atau kendaraan yang mendesak, atau keluarga yang tertimpa musibah. Setelah dipakai, jadikan pengisian kembali sebagai prioritas di anggaran bulan-bulan berikutnya.',
     warn:'Liburan, gawai baru, dan diskon belanja bukan darurat. Untuk itu gunakan sinking fund atau tabungan tujuan.'},
    {q:'Bagaimana kalau dana darurat <b>belum ada sama sekali</b>?', a:'Mulai dari target kecil yang terasa mungkin, misalnya Rp1 juta atau satu bulan pengeluaran, lalu naikkan bertahap. Manfaatkan pemasukan tak terduga seperti THR, bonus, atau gaji ke-13 untuk mempercepat.',
     ex:'Target awal 1 bulan pengeluaran Rp4 juta: sisihkan Rp500 ribu per bulan plus separuh THR. Dalam sekitar 5 bulan target awal tercapai.'}
   ]},
   {name:'Produk Simpanan & LPS', cards:[
    {q:'Apa beda <b>tabungan</b>, <b>giro</b>, dan <b>deposito</b>?', a:'Tabungan bisa ditarik kapan saja dengan bunga rendah. Giro dipakai untuk transaksi bisnis dengan cek atau bilyet giro. Deposito dikunci untuk tenor tertentu (1, 3, 6, atau 12 bulan) dengan bunga lebih tinggi, dan pencairan sebelum jatuh tempo biasanya dikenai penalti.',
     pts:['Deposito ARO (automatic roll over): otomatis diperpanjang saat jatuh tempo.','Bunga simpanan dikenai pajak final 20% untuk saldo di atas Rp7,5 juta (ketentuan umum perpajakan).','Bandingkan bunga bersih setelah pajak dan biaya administrasi.']},
    {q:'Bagaimana <b>LPS</b> menjamin simpanan?', a:'Lembaga Penjamin Simpanan menjamin simpanan nasabah di bank peserta hingga Rp2 miliar per nasabah per bank. Simpanan dijamin bila memenuhi tiga syarat yang dikenal sebagai 3T: Tercatat dalam pembukuan bank, Tingkat bunga tidak melebihi tingkat bunga penjaminan LPS, dan Tidak menyebabkan bank gagal (misalnya tidak terlibat kredit macet).',
     ex:'Per 1 Juli 2026, tingkat bunga penjaminan LPS untuk simpanan rupiah di bank umum adalah 3,75%. Deposito dengan bunga 6% di bank umum tidak termasuk simpanan yang dijamin.',
     tip:'Tingkat bunga penjaminan diperbarui berkala. Cek angka terbaru di lps.go.id sebelum menaruh dana besar.'},
    {q:'Bagaimana <b>membagi</b> dana besar agar tetap dijamin?', a:'Karena batasnya per nasabah per bank, dana di atas Rp2 miliar dapat dibagi ke beberapa bank peserta LPS. Simpanan di BPR dan bank syariah juga dijamin LPS dengan tingkat bunga penjaminan masing-masing.',
     warn:'Bunga yang jauh di atas rata-rata pasar adalah tanda untuk berhati-hati, bukan tanda bank lebih baik.'}
   ]},
   {name:'Strategi Menabung', cards:[
    {q:'Apa itu <b>bunga majemuk</b> pada tabungan dan deposito?', a:'Bunga yang diperoleh ikut disimpan sehingga periode berikutnya bunga dihitung dari pokok plus bunga sebelumnya. Deposito ARO yang bunganya ikut diperpanjang (pokok + bunga) memanfaatkan efek ini.',
     f:'Nilai akhir = Pokok × (1 + r)ⁿ',
     ex:'Rp10 juta dengan bunga bersih 3% per tahun selama 5 tahun: 10 × 1,03⁵ ≈ Rp11,59 juta.'},
    {q:'Bagaimana trik <b>otomatisasi</b> menabung?', a:'Kebiasaan yang otomatis lebih mudah bertahan dibanding mengandalkan disiplin setiap bulan.',
     pts:['Autodebet di hari gajian ke rekening tabungan terpisah.','Fitur "kantong" atau "goals" di aplikasi bank untuk setiap tujuan.','Round-up: membulatkan setiap transaksi dan menabung selisihnya.','Naikkan persentase tabungan 1% setiap ada kenaikan gaji.']},
    {q:'Apakah menabung saja <b>cukup</b>?', a:'Menabung cocok untuk dana darurat dan tujuan jangka pendek. Untuk tujuan jangka panjang, bunga tabungan biasanya di bawah inflasi sehingga daya beli tergerus. Tujuan di atas 3 sampai 5 tahun perlu didukung investasi yang sesuai profil risiko.',
     ex:'Inflasi 3% dan bunga tabungan bersih 1%: secara riil, daya beli uang turun sekitar 2% per tahun.'}
   ]}
  ]},

 {id:'utang', title:'Utang & Kredit Sehat', cat:'wajib', img:'t_utang',
  desc:'Membedakan utang produktif dan konsumtif, menjaga cicilan dalam batas aman, memahami biaya kredit, riwayat SLIK, dan strategi keluar dari jebakan utang.',
  src:'OJK, Buku Saku Cerdas Mengelola Keuangan · OJK, Layanan SLIK (idebku.ojk.go.id) · Bank Indonesia, ketentuan bunga kartu kredit · SEOJK 19/2023 tentang LPBBTI · CFPB, Debt and Credit',
  sets:[
   {name:'Rasio & Jenis Utang', cards:[
    {q:'Berapa <b>batas aman</b> total cicilan?', a:'Panduan umum: total cicilan tidak lebih dari 30% penghasilan bersih bulanan. Di atas itu, ruang untuk menabung dan kebutuhan pokok mulai terjepit. Bank juga memakai rasio sejenis (debt service ratio) saat menilai pengajuan kredit.',
     f:'Rasio cicilan = Total cicilan ÷ Penghasilan bersih × 100%',
     ex:'Penghasilan bersih Rp10 juta. Cicilan motor Rp1,2 juta + rencana KPR Rp3,5 juta = Rp4,7 juta atau 47%, jauh di atas batas aman.'},
    {q:'Apa beda utang <b>produktif</b> dan <b>konsumtif</b>?', a:'Utang produktif dipakai untuk sesuatu yang menambah nilai atau penghasilan, misalnya modal usaha, KPR, atau pendidikan yang meningkatkan kemampuan kerja. Utang konsumtif dipakai untuk barang yang nilainya cepat turun, misalnya gawai, liburan, atau gaya hidup.',
     pts:['Utang produktif tetap berisiko bila cicilannya melebihi kemampuan bayar.','Utang konsumtif sebaiknya dibatasi dan segera dilunasi.','Pertanyaan kunci: apakah utang ini menambah aset atau penghasilan di masa depan?']},
    {q:'Bagaimana memahami <b>bunga flat</b> dan <b>bunga efektif</b>?', a:'Bunga flat dihitung dari pokok awal sepanjang tenor sehingga terlihat kecil, sedangkan bunga efektif (anuitas) dihitung dari sisa pokok. Bunga flat 1% per bulan setara bunga efektif sekitar 1,8% per bulan untuk tenor 12 bulan. Bandingkan pinjaman memakai bunga efektif atau total biaya.',
     ex:'Pinjaman Rp12 juta, bunga flat 1% per bulan, tenor 12 bulan: bunga Rp120 ribu × 12 = Rp1,44 juta. Total bayar Rp13,44 juta atau Rp1,12 juta per bulan.',
     tip:'Mintalah simulasi total yang harus dibayar, termasuk biaya provisi, administrasi, dan asuransi kredit.'}
   ]},
   {name:'Kartu Kredit, Paylater & Pinjaman Daring', cards:[
    {q:'Bagaimana bunga <b>kartu kredit</b> bekerja?', a:'Bank Indonesia menetapkan batas maksimum bunga kartu kredit 1,75% per bulan (sekitar 21% per tahun). Jika tagihan dibayar penuh sebelum jatuh tempo, umumnya tidak ada bunga. Jika hanya membayar minimum, sisa tagihan dikenai bunga dan utang lama sekali lunas.',
     ex:'Tagihan Rp10 juta, hanya membayar minimum setiap bulan dengan bunga 1,75%: butuh bertahun-tahun untuk lunas dan total bunga bisa jutaan rupiah.',
     warn:'Tarik tunai kartu kredit dikenai biaya tarik tunai dan bunga sejak hari penarikan. Hindari kecuali darurat.'},
    {q:'Apa aturan <b>pinjaman daring (pinjol)</b> legal?', a:'Penyelenggara pinjaman daring legal wajib berizin OJK sebagai Layanan Pendanaan Bersama Berbasis Teknologi Informasi (LPBBTI). OJK membatasi manfaat ekonomi (bunga plus biaya sejenis) secara bertahap. Untuk pendanaan konsumtif tenor pendek, batasnya 0,3% per hari (2024), 0,2% per hari (2025), dan 0,1% per hari mulai 2026. Untuk pendanaan produktif, 0,1% per hari (2024 sampai 2025) dan 0,067% per hari mulai 2026.',
     pts:['Pinjol legal hanya boleh mengakses kamera, mikrofon, dan lokasi (dikenal dengan istilah CAMILAN).','Penagihan wajib beretika: tidak boleh mengancam atau menyebarkan data ke kontak.','Cek daftar penyelenggara berizin di ojk.go.id atau Kontak OJK 157.'],
     ex:'Pinjaman konsumtif Rp1 juta selama 30 hari pada batas 0,1% per hari: manfaat ekonomi maksimal sekitar Rp30 ribu.'},
    {q:'Apa yang perlu diperhatikan sebelum memakai <b>paylater</b>?', a:'Paylater adalah pinjaman. Ada biaya layanan atau bunga, denda keterlambatan, dan riwayatnya tercatat di SLIK. Pakai hanya untuk kebutuhan yang sudah dianggarkan dan pastikan cicilannya masuk hitungan rasio 30%.',
     tip:'Matikan paylater di aplikasi belanja jika sering tergoda belanja impulsif.'}
   ]},
   {name:'Riwayat Kredit & Keluar dari Utang', cards:[
    {q:'Apa itu <b>SLIK OJK</b> dan kolektibilitas?', a:'Sistem Layanan Informasi Keuangan mencatat riwayat kredit setiap debitur, termasuk kartu kredit, KPR, kredit kendaraan, dan paylater dari lembaga yang melapor. Kualitas kredit dikelompokkan menjadi lima kolektibilitas.',
     pts:['Kol 1 Lancar: dibayar tepat waktu.','Kol 2 Dalam Perhatian Khusus: tunggakan 1 sampai 90 hari.','Kol 3 Kurang Lancar: tunggakan 91 sampai 120 hari.','Kol 4 Diragukan: tunggakan 121 sampai 180 hari.','Kol 5 Macet: tunggakan di atas 180 hari.'],
     tip:'Cek SLIK pribadimu secara gratis melalui layanan iDebKu OJK sebelum mengajukan KPR.'},
    {q:'Strategi apa untuk melunasi <b>banyak utang</b>?', a:'Daftar semua utang beserta saldo, bunga, dan cicilan minimumnya. Bayar minimum di semua utang, lalu arahkan dana lebih ke satu utang prioritas.',
     pts:['Avalanche: dahulukan bunga tertinggi. Total bunga paling hemat.','Snowball: dahulukan saldo terkecil. Cepat terasa hasilnya sehingga memotivasi.','Konsolidasi: gabungkan utang berbunga tinggi ke satu pinjaman berbunga lebih rendah, hanya bila total biayanya benar lebih murah.'],
     ex:'Kartu kredit 1,75% per bulan, KTA 1% per bulan, cicilan motor 0,8% per bulan. Metode avalanche melunasi kartu kredit lebih dulu.'},
    {q:'Apa tanda-tanda <b>jebakan utang</b> dan apa yang harus dilakukan?', a:'Tanda bahaya: berutang untuk membayar utang lain, cicilan di atas 50% penghasilan, sering telat bayar, dan tidak tahu total utang sendiri.',
     pts:['Hentikan utang baru, termasuk paylater.','Hubungi pemberi pinjaman untuk restrukturisasi sebelum menunggak.','Jual aset yang tidak produktif untuk melunasi utang berbunga tinggi.','Laporkan penagihan tidak beretika ke Kontak OJK 157.'],
     warn:'Hindari "gali lubang tutup lubang" memakai pinjol ilegal. Bunganya tidak terkendali dan cara penagihannya merugikan.'}
   ]}
  ]},

 {id:'digital', title:'Pembayaran Digital & QRIS', cat:'wajib', img:'t_digital',
  desc:'Mengenal ekosistem pembayaran digital Indonesia: QRIS, BI-FAST, uang elektronik, kartu debit, beserta biaya dan cara bertransaksi yang aman.',
  src:'Bank Indonesia, Sistem Pembayaran: QRIS dan BI-FAST (bi.go.id) · Bank Indonesia, Blueprint Sistem Pembayaran Indonesia 2030 · OJK, Buku Seri Literasi Keuangan Perbankan · BIS, Fast Payments: Enhancing the Speed and Availability of Retail Payments',
  sets:[
   {name:'QRIS', cards:[
    {q:'Apa itu <b>QRIS</b>?', a:'Quick Response Code Indonesian Standard adalah standar kode QR nasional yang ditetapkan Bank Indonesia. Satu kode QRIS bisa dibayar memakai aplikasi bank atau dompet digital mana pun yang berizin, sehingga pedagang cukup memasang satu kode.',
     pts:['QRIS statis: kode tercetak, pembeli memasukkan nominal sendiri.','QRIS dinamis: kode muncul di mesin kasir dengan nominal tertentu.','QRIS Tuntas: mendukung transfer, tarik tunai, dan setor tunai.','QRIS juga bisa dipakai di beberapa negara mitra (QRIS antarnegara) seperti Malaysia, Thailand, Singapura, dan Jepang.']},
    {q:'Siapa yang menanggung <b>biaya QRIS</b>?', a:'Biaya QRIS disebut Merchant Discount Rate (MDR) dan ditanggung pedagang, bukan pembeli. Bank Indonesia menegaskan pedagang tidak boleh membebankan MDR kepada konsumen. Untuk usaha mikro, transaksi sampai Rp500.000 dibebaskan dari MDR sejak 1 Desember 2024, sedangkan transaksi di atasnya dikenai MDR 0,3%.',
     warn:'Jika pedagang menambahkan biaya karena kamu membayar dengan QRIS, itu tidak sesuai ketentuan dan bisa dilaporkan.'},
    {q:'Bagaimana memastikan pembayaran QRIS <b>aman</b>?', a:'Sebelum menekan bayar, selalu cek nama pedagang yang tampil di aplikasi. Penipu kadang menempelkan stiker QRIS palsu di atas kode asli di tempat umum seperti kotak amal atau parkir.',
     pts:['Cocokkan nama merchant di layar dengan nama toko.','Pastikan nominal sudah benar sebelum memasukkan PIN.','Simpan bukti transaksi untuk keperluan komplain.']}
   ]},
   {name:'Transfer & Uang Elektronik', cards:[
    {q:'Apa itu <b>BI-FAST</b>?', a:'Infrastruktur transfer antarbank milik Bank Indonesia yang memproses transaksi secara real-time 24/7. Biaya maksimal yang boleh dikenakan bank kepada nasabah adalah Rp2.500 per transaksi, dengan batas nominal per transaksi hingga Rp250 juta.',
     pts:['Bisa memakai alias (nomor ponsel atau email) sebagai pengganti nomor rekening, tergantung dukungan bank.','Lebih murah dibanding transfer online lama yang umumnya Rp6.500.','Untuk nominal sangat besar, bank memakai SKNBI atau RTGS.']},
    {q:'Apa beda <b>uang elektronik berbasis kartu</b> dan <b>berbasis server</b>?', a:'Uang elektronik berbasis kartu (chip) menyimpan saldo di kartu, misalnya kartu tol dan transportasi. Uang elektronik berbasis server menyimpan saldo di sistem penerbit, misalnya dompet digital di ponsel. Penerbit uang elektronik wajib berizin Bank Indonesia.',
     pts:['Batas saldo uang elektronik terverifikasi (registered) lebih tinggi dibanding yang belum terverifikasi.','Saldo uang elektronik tidak termasuk simpanan yang dijamin LPS.','Kartu fisik yang hilang biasanya tidak bisa diblokir, sehingga saldonya ikut hilang.'],
     tip:'Simpan saldo secukupnya untuk kebutuhan transaksi, bukan sebagai tempat menabung.'},
    {q:'Bagaimana membandingkan <b>biaya transaksi</b> digital?', a:'Biaya kecil yang sering terjadi bisa menumpuk. Biasakan memilih kanal termurah untuk kebutuhan yang sama.',
     ex:'Transfer 20 kali sebulan dengan biaya Rp6.500 = Rp130 ribu. Memakai BI-FAST Rp2.500 = Rp50 ribu. Selisih Rp80 ribu per bulan atau hampir Rp1 juta per tahun.',
     pts:['Cek biaya top up dompet digital dan biaya admin bulanan rekening.','Gunakan QRIS untuk belanja di pedagang karena pembeli tidak dikenai biaya MDR.']}
   ]},
   {name:'Kebiasaan Transaksi Aman', cards:[
    {q:'Apa saja <b>kebiasaan dasar</b> transaksi digital yang aman?', a:'Mayoritas pembobolan rekening terjadi karena data rahasia bocor dari pemiliknya sendiri, bukan karena sistem bank diretas.',
     pts:['Jangan bagikan PIN, OTP, password, dan CVV kepada siapa pun termasuk yang mengaku petugas bank.','Aktifkan notifikasi transaksi dan batasi limit transfer harian.','Gunakan jaringan internet pribadi, hindari Wi-Fi publik untuk transaksi.','Perbarui aplikasi dan sistem operasi ponsel secara berkala.']},
    {q:'Apa yang dilakukan jika <b>salah transfer</b> atau ada transaksi tidak dikenal?', a:'Segera hubungi call center resmi bank (nomor tertera di kartu atau situs resmi), minta pemblokiran bila perlu, dan ajukan pengaduan tertulis. Simpan semua bukti transaksi. Bila tidak selesai, eskalasi pengaduan ke OJK melalui Kontak OJK 157 atau Aplikasi Portal Perlindungan Konsumen (APPK).',
     warn:'Waspada akun media sosial palsu yang mengaku "CS bank" saat kamu mengeluh di kolom komentar. Bank resmi tidak akan meminta data rahasia lewat DM.'}
   ]}
  ]}
);
